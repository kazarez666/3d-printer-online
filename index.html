<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080d16" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>3D Printer Online</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#080d16;color:#dfe8f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:grid;place-items:center}.boot{text-align:center;padding:24px}.boot b{display:block;font-size:20px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;opacity:.62;font-size:13px}
  </style>
</head>
<body>
  <div class="boot"><b>3D PRINTER ONLINE</b><span>LOADING LATEST BUILD…</span></div>
  <script>
    (async()=>{
      let version='3.6.1';
      try{
        const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
        const d=await r.json();
        if(d&&d.version) version=d.version;
      }catch(e){}
      const target='./app.html?v='+encodeURIComponent(version)+'&t='+Date.now();
      location.replace(target);
    })();
  </script>
</body>
</html>
