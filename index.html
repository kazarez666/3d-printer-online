<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1119">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>3D Printer Online — Prototype 0.4</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f7fb;background:#0a0d13}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 18%,#273147 0,#111722 48%,#080a0f 100%)}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#scene{position:fixed;inset:0;z-index:0}.hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:900;letter-spacing:.055em;font-size:clamp(13px,2.4vw,18px);text-transform:uppercase}.cash{padding:10px 14px;border-radius:16px;background:rgba(10,14,21,.8);border:1px solid rgba(255,255,255,.11);font-size:20px;font-weight:900}.bottom{display:grid;gap:9px;width:min(560px,100%);margin:0 auto}.selector{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.model-btn{border:1px solid rgba(255,255,255,.1);background:rgba(14,20,31,.82);color:#fff;border-radius:16px;padding:9px 6px;min-height:54px;font-weight:800;cursor:pointer}.model-btn.active{outline:2px solid #6d8cff;background:rgba(45,66,111,.86)}.model-btn.locked{opacity:.45}.model-btn small{display:block;opacity:.55;font-size:10px;margin-top:2px}.card{pointer-events:auto;background:rgba(10,14,21,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.11);border-radius:24px;padding:14px;box-shadow:0 16px 46px rgba(0,0,0,.34)}.model-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.model-name{font-weight:900;font-size:18px}.model-sub{opacity:.62;font-size:12px;margin-top:3px}.value{font-weight:950;font-size:19px}.value small{display:block;font-size:9px;opacity:.5;text-align:right;letter-spacing:.1em}.progress{height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}.progress>div{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#61e5ff,#638cff,#b274ff);box-shadow:0 0 15px rgba(97,229,255,.55)}.actions{display:grid;grid-template-columns:1fr 125px 125px;gap:8px}.primary,.upgrade{border:0;border-radius:17px;min-height:56px;color:#fff;font-weight:950;cursor:pointer}.primary{background:linear-gradient(135deg,#2468ff,#7b39ea);font-size:18px}.upgrade{background:linear-gradient(135deg,#182235,#273652);font-size:12px;border:1px solid rgba(255,255,255,.07)}button:disabled{opacity:.42;cursor:default}.status{position:fixed;z-index:15;top:72px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;font-weight:900;text-shadow:0 3px 16px rgba(0,0,0,.65);white-space:nowrap}.status .big{font-size:clamp(25px,6vw,44px);line-height:1}.status .small{opacity:.72;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}.toast{position:fixed;z-index:40;left:50%;bottom:210px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:rgba(9,12,18,.94);border:1px solid rgba(255,255,255,.12);padding:10px 15px;border-radius:999px;font-weight:850;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.flash{position:fixed;z-index:5;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,230,145,.2),transparent 38%);opacity:0;transition:opacity .18s}.flash.on{opacity:1}@media(max-width:620px){.hud{padding-left:10px;padding-right:10px}.actions{grid-template-columns:1fr 1fr}.primary{grid-column:1/-1}.toast{bottom:285px}.selector{gap:5px}.model-btn{font-size:11px;padding:6px 3px}.brand{max-width:230px}}
</style>
</head>
<body><div id="app"><div id="scene"></div><div class="flash" id="flash"></div><div class="hud"><div class="topbar"><div class="brand">3D Printer Online <span style="opacity:.42">Prototype <span id="versionLabel">0.4</span></span></div><div class="cash" id="cash">$0</div></div><div class="bottom"><div class="selector" id="selector"></div><div class="card"><div class="model-row"><div><div class="model-name" id="modelName">Rubber Duck</div><div class="model-sub" id="modelSub">PLA • STARTER PRINT</div></div><div class="value"><small>SELL VALUE</small><span id="modelValue">$25</span></div></div><div class="progress"><div id="progressBar"></div></div><div class="actions"><button class="primary" id="mainButton">PRINT</button><button class="upgrade" id="speedButton">SPEED LV.1<br><span>$20</span></button><button class="upgrade" id="extruderButton">EXTRUDER LV.1<br><span>$80</span></button></div></div></div></div><div class="status"><div class="small" id="statusSmall">LOADING PRINTER</div><div class="big" id="statusBig"></div></div><div class="toast" id="toast"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const APP_VERSION='0.4';
(async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const v=(await r.json()).version;if(v&&v!==APP_VERSION){const u=new URL(location.href);u.searchParams.set('v',v);location.replace(u.toString())}}catch(e){}})();
setInterval(async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const v=(await r.json()).version;if(v&&v!==APP_VERSION){const u=new URL(location.href);u.searchParams.set('v',v);location.replace(u.toString())}}catch(e){}},30000);
(function(){
const $=s=>document.querySelector(s),ui={cash:$('#cash'),main:$('#mainButton'),speed:$('#speedButton'),extruder:$('#extruderButton'),bar:$('#progressBar'),small:$('#statusSmall'),big:$('#statusBig'),toast:$('#toast'),flash:$('#flash'),selector:$('#selector'),name:$('#modelName'),sub:$('#modelSub'),value:$('#modelValue')};
function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');setTimeout(()=>ui.toast.classList.remove('show'),1200)}
if(typeof THREE==='undefined'){ui.small.textContent='3D ENGINE FAILED TO LOAD';ui.big.textContent='RELOAD';ui.main.textContent='RETRY';ui.main.onclick=()=>location.reload();return}
const MODELS=[
{id:'duck',name:'Rubber Duck',short:'DUCK',value:25,time:4000,unlock:s=>true,sub:'PLA • STARTER PRINT'},
{id:'cat',name:'Lucky Cat',short:'CAT',value:60,time:5600,unlock:s=>s.sales>=1,sub:'PLA • UNLOCKED AFTER 1 SALE'},
{id:'robot',name:'Mini Robot',short:'ROBOT',value:150,time:7600,unlock:s=>s.extruder>=1,sub:'PLA • REQUIRES EXTRUDER LV.2'}];
let saveData={cash:0,speed:0,extruder:0,sales:0,selected:'duck'};try{const old=JSON.parse(localStorage.getItem('printer-prototype')||'{}');saveData.cash=+old.cash||0;saveData.speed=+(old.speedLevel??old.speed)||0;saveData.extruder=+old.extruder||0;saveData.sales=+old.sales||0;saveData.selected=old.selected||'duck'}catch(e){}
const persist=()=>{try{localStorage.setItem('printer-prototype',JSON.stringify(saveData))}catch(e){}};
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x101722,8.5,17);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,50);camera.position.set(5.1,3.85,7.1);camera.lookAt(0,1.25,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.45:1.9));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.localClippingEnabled=true;$('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc4d8ff,0x17120d,1.55));const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const rim=new THREE.PointLight(0x5e8cff,30,10,2);rim.position.set(-3,3,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0x151c28,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);
const printer=new THREE.Group();scene.add(printer);const dark=new THREE.MeshStandardMaterial({color:0x1d2735,roughness:.48,metalness:.44}),dark2=new THREE.MeshStandardMaterial({color:0x0c121a,roughness:.36,metalness:.66}),accent=new THREE.MeshStandardMaterial({color:0x48658f,roughness:.25,metalness:.7}),rail=new THREE.MeshStandardMaterial({color:0xaab4c1,metalness:.86,roughness:.2});function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;printer.add(m);return m}box(4.3,.35,3.7,dark,0,.18,0);box(3.25,.1,2.65,new THREE.MeshStandardMaterial({color:0x202b38,metalness:.4,roughness:.3}),0,.42,0);box(.24,3.4,.24,dark2,-1.82,2,-1.42);box(.24,3.4,.24,dark2,1.82,2,-1.42);box(3.85,.26,.3,dark2,0,3.6,-1.42);box(3.55,.14,.14,rail,0,2.5,-.35);
const headGroup=new THREE.Group();printer.add(headGroup);const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.54,.62),accent);headGroup.add(head);const nozzle=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,18),new THREE.MeshStandardMaterial({color:0xf0aa5c,metalness:.82,roughness:.17}));nozzle.rotation.x=Math.PI;nozzle.position.y=-.4;head.add(nozzle);const glow=new THREE.PointLight(0xffac45,0,1.8,2);glow.position.y=-.48;head.add(glow);
const spool=new THREE.Group();spool.position.set(1.9,3.15,-1.45);spool.rotation.z=Math.PI/2;printer.add(spool);spool.add(new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.72,28),dark2));const filament=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.42,42),new THREE.MeshStandardMaterial({color:0xf3b334,roughness:.43}));spool.add(filament);const sr=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.07,42),dark2);sr.position.y=.26;spool.add(sr);const sr2=sr.clone();sr2.position.y=-.26;spool.add(sr2);
const baseY=.47,clip=new THREE.Plane(new THREE.Vector3(0,-1,0),baseY),models3d={};
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.34,clippingPlanes:[clip]})}function add(g,geo,ma,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,ma);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;g.add(m);return m}
function buildDuck(){const g=new THREE.Group(),y=mat(0xf5c542),o=mat(0xf47f31),b=mat(0x0c1016);add(g,new THREE.SphereGeometry(.76,26,18),y,0,.58,0,1.2,.86,1);add(g,new THREE.SphereGeometry(.48,24,16),y,.42,1.25,-.03);add(g,new THREE.SphereGeometry(.52,22,16),y,-.65,.67,.05,.85,.46,.7);add(g,new THREE.ConeGeometry(.19,.48,4),o,.87,1.22,.08,1,.6,1).rotation.z=-Math.PI/2;add(g,new THREE.SphereGeometry(.055,12,8),b,.67,1.39,.4);add(g,new THREE.SphereGeometry(.055,12,8),b,.67,1.39,-.43);return {g,h:1.75}}
function buildCat(){const g=new THREE.Group(),w=mat(0xf0eee7),p=mat(0xf2a6b8),b=mat(0x11151c);add(g,new THREE.SphereGeometry(.62,24,18),w,0,.72,0,.9,1.05,.85);add(g,new THREE.SphereGeometry(.48,24,18),w,0,1.42,0);add(g,new THREE.ConeGeometry(.22,.45,3),w,-.25,1.83,0).rotation.z=.1;add(g,new THREE.ConeGeometry(.22,.45,3),w,.25,1.83,0).rotation.z=-.1;add(g,new THREE.SphereGeometry(.05,10,8),b,-.17,1.48,.43);add(g,new THREE.SphereGeometry(.05,10,8),b,.17,1.48,.43);add(g,new THREE.SphereGeometry(.055,10,8),p,0,1.34,.46);add(g,new THREE.CylinderGeometry(.12,.15,.85,14),w,.58,.82,-.05).rotation.z=-.4;return {g,h:2.05}}
function buildRobot(){const g=new THREE.Group(),c=mat(0x73b9ff),d=mat(0x182235),e=mat(0x8fffb0);add(g,new THREE.BoxGeometry(1.15,.9,.8),c,0,.85,0);add(g,new THREE.BoxGeometry(.92,.62,.72),c,0,1.62,0);add(g,new THREE.CylinderGeometry(.05,.05,.34,10),d,0,2.1,0);add(g,new THREE.SphereGeometry(.1,12,8),e,0,2.3,0);add(g,new THREE.SphereGeometry(.07,10,8),e,-.23,1.68,.38);add(g,new THREE.SphereGeometry(.07,10,8),e,.23,1.68,.38);add(g,new THREE.BoxGeometry(.22,.78,.25),d,-.75,.88,0);add(g,new THREE.BoxGeometry(.22,.78,.25),d,.75,.88,0);add(g,new THREE.BoxGeometry(.28,.55,.34),d,-.3,.22,0);add(g,new THREE.BoxGeometry(.28,.55,.34),d,.3,.22,0);return {g,h:2.45}}
models3d.duck=buildDuck();models3d.cat=buildCat();models3d.robot=buildRobot();Object.values(models3d).forEach(o=>{o.g.position.set(0,baseY,.05);o.g.visible=false;scene.add(o.g)});
const layer=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.55),new THREE.MeshBasicMaterial({color:0xffe28a,transparent:true,opacity:.8,side:THREE.DoubleSide}));layer.rotation.x=-Math.PI/2;layer.visible=false;scene.add(layer);
let state='idle',start=0,completionAt=0,selected=MODELS.find(m=>m.id===saveData.selected&&m.unlock(saveData))||MODELS[0];
function renderSelector(){ui.selector.innerHTML='';MODELS.forEach(m=>{const unlocked=m.unlock(saveData),b=document.createElement('button');b.className='model-btn'+(m.id===selected.id?' active':'')+(unlocked?'':' locked');b.innerHTML=m.short+'<small>'+(unlocked?'$'+m.value:(m.id==='robot'?'EXTRUDER LV.2':'SELL 1 DUCK'))+'</small>';b.onclick=()=>{if(state!=='idle')return;if(!unlocked){toast(m.id==='robot'?'Upgrade Extruder to unlock':'Sell your first Duck to unlock');return}selected=m;saveData.selected=m.id;persist();showSelected();renderSelector()};ui.selector.appendChild(b)})}
function showSelected(){Object.values(models3d).forEach(o=>o.g.visible=false);models3d[selected.id].g.visible=true;clip.constant=baseY-3;ui.name.textContent=selected.name;ui.sub.textContent=selected.sub;ui.value.textContent='$'+selected.value}
function speedCost(){return 20+saveData.speed*35}function extruderCost(){return 80+saveData.extruder*120}function duration(){return selected.time*Math.pow(.82,saveData.speed)}
function update(){ui.cash.textContent='$'+saveData.cash;ui.speed.innerHTML='SPEED LV.'+(saveData.speed+1)+'<br><span>$'+speedCost()+'</span>';ui.extruder.innerHTML='EXTRUDER LV.'+(saveData.extruder+1)+'<br><span>$'+extruderCost()+'</span>';ui.speed.disabled=state==='printing'||saveData.cash<speedCost();ui.extruder.disabled=state==='printing'||saveData.cash<extruderCost();if(state==='idle'){ui.main.disabled=false;ui.main.textContent='PRINT';ui.small.textContent='READY TO PRINT';ui.big.textContent=''}else if(state==='printing'){ui.main.disabled=true;ui.main.textContent='PRINTING…'}else{ui.main.disabled=false;ui.main.textContent='SELL  +$'+selected.value;ui.small.textContent='PRINT COMPLETE';ui.big.textContent=selected.name}}
function startPrint(){if(state!=='idle')return;state='printing';start=performance.now();clip.constant=baseY;layer.visible=true;glow.intensity=5;ui.small.textContent='FIRST LAYER';update()}
function complete(){state='complete';completionAt=performance.now();layer.visible=false;glow.intensity=0;clip.constant=baseY+models3d[selected.id].h+.5;ui.flash.classList.add('on');setTimeout(()=>ui.flash.classList.remove('on'),220);toast('PRINT COMPLETE');update()}
function sell(){if(state!=='complete')return;saveData.cash+=selected.value;saveData.sales++;state='idle';persist();toast('+$'+selected.value+' SOLD');renderSelector();update()}
ui.main.onclick=()=>state==='complete'?sell():startPrint();ui.speed.onclick=()=>{const c=speedCost();if(saveData.cash<c||state==='printing')return;saveData.cash-=c;saveData.speed++;persist();toast('PRINT SPEED +18%');update()};ui.extruder.onclick=()=>{const c=extruderCost();if(saveData.cash<c||state==='printing')return;saveData.cash-=c;saveData.extruder++;persist();toast(saveData.extruder===1?'ROBOT UNLOCKED!':'EXTRUDER UPGRADED');renderSelector();update()};
showSelected();renderSelector();update();let prev=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(state==='printing'){const p=Math.min(1,(now-start)/duration()),e=THREE.MathUtils.smootherstep(p,0,1),h=models3d[selected.id].h,y=baseY+h*e;clip.constant=y;ui.bar.style.width=Math.round(p*100)+'%';ui.big.textContent=Math.round(p*100)+'%';ui.small.textContent=p<.12?'FIRST LAYER':p>.88?'FINAL LAYERS':'PRINTING';const passes=16+p*10,phase=(p*passes)%1,row=Math.floor(p*passes)%2;headGroup.position.set((row?-1:1)*(-1.1+2.2*phase),y+.59,Math.sin(p*80)*.38);layer.position.set(0,y,.05);layer.material.opacity=.55+.35*Math.sin(now*.02);spool.rotation.x+=dt*(2.5+saveData.speed*.5);if(p>=1)complete()}else{ui.bar.style.width=state==='complete'?'100%':'0%';headGroup.position.x+=(0-headGroup.position.x)*Math.min(1,dt*4);headGroup.position.y+=(2.35-headGroup.position.y)*Math.min(1,dt*4);headGroup.position.z+=(-.3-headGroup.position.z)*Math.min(1,dt*4);if(state==='complete'){models3d[selected.id].g.rotation.y=Math.sin((now-completionAt)*.001)*.18}}const target=state==='complete'?1:0;camera.position.x+=(5.1-target*.65-camera.position.x)*Math.min(1,dt*2.5);camera.position.y+=(3.85-target*.28-camera.position.y)*Math.min(1,dt*2.5);camera.position.z+=(7.1-target*.7-camera.position.z)*Math.min(1,dt*2.5);camera.lookAt(0,1.25,0);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
})();
</script></body></html>
