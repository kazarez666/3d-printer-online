<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080d16" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>3D Printer Online — Rebuild 3.0.1</title>
  <link rel="stylesheet" href="style.css?v=3.0.1" />
</head>
<body>
  <main id="app">
    <div id="scene"></div>
    <header class="topbar">
      <div class="brand"><b>3D PRINTER ONLINE</b><span>REBUILD 3.0.1</span></div>
      <div class="top-actions">
        <button id="resetView" class="chip">RESET VIEW</button>
        <div id="cash" class="cash">$0</div>
      </div>
    </header>
    <section class="hero-status">
      <small id="statusEyebrow">REAL MODEL • CC0</small>
      <h1 id="statusTitle">CAT FIGURINE</h1>
    </section>
    <section class="bottom-panel">
      <div class="model-row">
        <div><div class="model-name">Kenney Cat</div><div class="model-meta">Real mesh asset • $10</div></div>
        <div class="value"><small>VALUE</small><strong>$10</strong></div>
      </div>
      <div class="progress-track"><div id="progressBar"></div></div>
      <button id="printButton" class="print-button" disabled>LOADING MODEL…</button>
      <div class="hint">DRAG TO ROTATE • WHEEL / PINCH TO ZOOM</div>
    </section>
    <div id="toast" class="toast"></div><div id="flash" class="flash"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="app.js?v=3.0.1"></script>
</body>
</html>
