name: Apply Prototype 0.6

on:
  push:
    paths:
      - 'scripts/apply_prototype_06.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Prototype 0.6 patch
        run: python scripts/apply_prototype_06.py
      - name: Commit Prototype 0.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prototype 0.6 printing process overhaul"
            git push
          fi