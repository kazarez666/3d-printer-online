name: Hotfix Maine Coon 3.2.1 once
on:
  push:
    paths:
      - '.github/workflows/hotfix-maine-321.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Maine Coon 3.2.1 hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore hotfix payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/blobs/496562ffcd227a4949ffb388c24364e5423ddc79 --jq .content | tr -d '\n' | base64 -d > /tmp/hotfix321.tar.gz
          tar -xzf /tmp/hotfix321.tar.gz
          node --check app.js
          grep -q "APP_VERSION='3.2.1'" app.js
          grep -q "src:'assets/pets/animal-cat.glb'.*maine:true" app.js
          ! grep -q "animal-lion.glb" app.js
          grep -q '"version":"3.2.1"' version.json
      - name: Commit hotfix and self-delete
        run: |
          rm -f .github/workflows/hotfix-maine-321.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hotfix 3.2.1 replace lion with Maine Coon cat'
          git push
