name: Restore clean Prototype 0.9
on:
  push:
    paths:
      - '.github/workflows/restore-clean-09.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable 0.8 and add 0.1x
        shell: bash
        run: |
          git show 814b520494bd64d20a5a8c0975bf5c4fa05f31d4:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Prototype 0.8','Prototype 0.9')
          s=s.replace('id="versionLabel">0.8<','id="versionLabel">0.9<')
          s=s.replace("const APP_VERSION='0.8';","const APP_VERSION='0.9';")
          s=s.replace('const TIME_SCALES=[1,.5,.25];','const TIME_SCALES=[1,.5,.25,.1];')
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.9"\n}\n')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('id="timeButton"') == 1
          assert s.count('const TIME_SCALES') == 1
          assert s.count('ui.time.onclick') == 1
          assert 'const TIME_SCALES=[1,.5,.25,.1];' in s
          print('clean checks passed')
          PY
          rm .github/workflows/restore-clean-09.yml
      - name: Commit repaired build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json .github/workflows/restore-clean-09.yml
          git commit -m "Restore clean Prototype 0.9 with 0.1x slow motion"
          git push
