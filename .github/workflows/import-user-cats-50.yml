name: Recover scrambled user cat GLBs 5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-cats-50.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover GLBs by XZ-valid permutation search
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/catperm
          mkdir -p /tmp/catperm/valid
          CANDIDATES=(
            b21e9405e8935998a67ccb745e64abdecfb11096
            cb1e04bbb87344aab90d77ba9de9c4f773e06ebb
            ea0f5cc84d6af7bed8403fc0895ec3c0cd06ebfd
            795d0b5cbdd76017296afa17e6e75667d74a8b63
            e2c2f930dac06d33b4066da79d3a9777f08d6ed2
            a6d4f96b7c09fcfee00b0d9ead6cef984ed1f68f
            90fc200197d6821c872698ff674b048eeae347b6
            b3c3b985ca85475ae9e247b4ef87957b815e68cf
            e4740591351eb7a3c982955080a792ef4d9aae92
            3066a48dc55e4d953323f9b599690e3365d18fe4
            56429f985be01a3ea2fa7e218188ff64efd2eba7
            8f77d674da6b929297bb06d69fc3ec9c8bea1f77
            a0fb7955d403a6672cc45c382f99d93dda90a434
            cfe5b3916f96436de0126564709f33bde2850fe9
            fcbcbdb11cafdc9b02912cecd7e04cb0b12a1ac6
            b6525d7347ea64babe84ffef52a5dd0518b42784
          )
          : > /tmp/catperm/list.txt
          for sha in "${CANDIDATES[@]}"; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/catperm/$sha.txt"
            echo "$sha" >> /tmp/catperm/list.txt
          done

          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,json,struct

          root=Path('/tmp/catperm')
          shas=root.joinpath('list.txt').read_text().splitlines()
          parts=[root.joinpath(s+'.txt').read_bytes() for s in shas]
          parts=[b''.join(p.split()) for p in parts]
          starts=[i for i,p in enumerate(parts) if p.startswith(b'/Td6WFo')]
          continuations=[i for i in range(len(parts)) if i not in starts]
          seen={}
          tested=0
          prefix_ok=0

          def decode_prefix(indices):
              nonlocal_dummy=None
              txt=b''.join(parts[i] for i in indices)
              usable=(len(txt)//4)*4
              if usable<8:return None,None,False
              try:
                  packed=base64.b64decode(txt[:usable],validate=True)
              except Exception:
                  return None,None,False
              if not packed.startswith(b'\xfd7zXZ\x00'):
                  return None,None,False
              d=lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              try:
                  raw=d.decompress(packed)
              except lzma.LZMAError:
                  return None,None,False
              return raw,d,True

          def parse_glb(raw):
              if len(raw)<20 or raw[:4]!=b'glTF':return None
              _,version,total=struct.unpack_from('<4sII',raw,0)
              if version!=2 or total!=len(raw):return None
              clen,ctype=struct.unpack_from('<II',raw,12)
              if ctype!=0x4E4F534A:return None
              try:return json.loads(raw[20:20+clen].decode().rstrip(' \t\r\n\0'))
              except Exception:return None

          # Correct continuations should keep the XZ decoder valid at every added chunk.
          # DFS is heavily pruned by XZ integrity, so arbitrary prior upload ordering is okay.
          def walk(seq,remaining,depth=0):
              global tested,prefix_ok
              tested+=1
              raw,d,ok=decode_prefix(seq)
              if not ok:return
              prefix_ok+=1
              if d.eof:
                  # Decode the COMPLETE base64 text (including any final non-quad chars after padding check).
                  txt=b''.join(parts[i] for i in seq)
                  try:
                      packed=base64.b64decode(txt,validate=True)
                      full=lzma.decompress(packed)
                  except Exception:
                      return
                  doc=parse_glb(full)
                  if doc:
                      digest=hashlib.sha256(full).hexdigest()
                      if digest not in seen:
                          seen[digest]={
                            'indices':seq[:],
                            'blob_shas':[shas[i] for i in seq],
                            'glb_bytes':len(full),
                            'xz_bytes':len(packed),
                            'sha256':digest,
                            'meshes':len(doc.get('meshes',[]) or []),
                            'nodes':len(doc.get('nodes',[]) or []),
                            'materials':len(doc.get('materials',[]) or []),
                          }
                          (root/'valid'/f'{digest[:12]}.glb').write_bytes(full)
                  return
              if depth>=7:return
              for nxt in list(remaining):
                  # base64 continuations only; another XZ header means another model, not this stream
                  nr=[x for x in remaining if x!=nxt]
                  walk(seq+[nxt],nr,depth+1)

          for st in starts:
              walk([st],continuations[:],0)

          report={'starts':starts,'continuations':continuations,'tested':tested,'prefix_ok':prefix_ok,'valid_count':len(seen),'valid':list(seen.values())}
          Path('cat-permutation-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

          rm -rf assets/cats/recovered-upload
          mkdir -p assets/cats/recovered-upload
          cp /tmp/catperm/valid/*.glb assets/cats/recovered-upload/ 2>/dev/null || true

      - name: Commit permutation recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-permutation-report.json assets/cats/recovered-upload
          git commit -m 'Recover scrambled uploaded cat GLBs' || exit 0
          git push

# permutation-trigger-1
