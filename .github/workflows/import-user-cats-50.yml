name: Reconstruct user cat blobs 5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-cats-50.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find valid contiguous base64 XZ GLB groups
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/catrecon
          mkdir -p /tmp/catrecon
          CANDIDATES=(
            b21e9405e8935998a67ccb745e64abdecfb11096
            cb1e04bbb87344aab90d77ba9de9c4f773e06ebb
            ea0f5cc84d6af7bed8403fc0895ec3c0cd06ebfd
            795d0b5cbdd76017296afa17e6e75667d74a8b63
            e2c2f930dac06d33b4066da79d3a9777f08d6ed2
            a6d4f96b7c09fcfee00b0d9ead6cef984ed1f68f
            90fc200197d6821c872698ff674b048eeae347b6
            b3c3b985ca85475ae9e247b4ef87957b815e68cf
            e4740591351eb7a3c982955080a792ef4d9aae92
            3066a48dc55e4d953323f9b599690e3365d18fe4
            56429f985be01a3ea2fa7e218188ff64efd2eba7
            8f77d674da6b929297bb06d69fc3ec9c8bea1f77
            a0fb7955d403a6672cc45c382f99d93dda90a434
            cfe5b3916f96436de0126564709f33bde2850fe9
            fcbcbdb11cafdc9b02912cecd7e04cb0b12a1ac6
            b6525d7347ea64babe84ffef52a5dd0518b42784
          )
          : > /tmp/catrecon/list.txt
          for sha in "${CANDIDATES[@]}"; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/catrecon/$sha.txt"
            echo "$sha" >> /tmp/catrecon/list.txt
          done

          python - <<'PY'
          from pathlib import Path
          import base64, lzma, itertools

          root=Path('/tmp/catrecon')
          shas=root.joinpath('list.txt').read_text().splitlines()
          parts=[root.joinpath(s+'.txt').read_bytes() for s in shas]
          targets={506016:'siamese',754420:'maine_coon',582060:'russian_blue',557136:'bengal',452116:'sphynx'}
          lines=[]
          found={}

          for i in range(len(parts)):
              acc=b''
              for j in range(i,len(parts)):
                  acc += parts[j]
                  compact=b''.join(acc.split())
                  try:
                      packed=base64.b64decode(compact,validate=True)
                  except Exception:
                      continue
                  if not packed.startswith(b'\xfd7zXZ\x00'):
                      continue
                  try:
                      raw=lzma.decompress(packed)
                  except Exception:
                      continue
                  magic=raw[:12].hex()
                  lines.append(f'{i}-{j} chars={len(compact)} packed={len(packed)} out={len(raw)} magic={magic}')
                  if raw[:4]==b'glTF' and len(raw) in targets:
                      breed=targets[len(raw)]
                      out=root/(breed+'.glb')
                      out.write_bytes(raw)
                      found[breed]=(i,j,len(raw),shas[i],shas[j])

          # Also try every ordered subsequence that starts with an XZ base64 header.
          # This handles chunks that were interleaved by earlier parallel upload calls.
          start_indices=[i for i,p in enumerate(parts) if p.startswith(b'/Td6WFo')]
          for i in start_indices:
              rest=[k for k in range(i+1,len(parts))]
              for r in range(1,min(5,len(rest))+1):
                  for combo_tail in itertools.combinations(rest,r):
                      idx=(i,)+combo_tail
                      compact=b''.join(b''.join(parts[k].split()) for k in idx)
                      if len(compact)%4==1:
                          continue
                      try:
                          packed=base64.b64decode(compact,validate=True)
                          if not packed.startswith(b'\xfd7zXZ\x00'):
                              continue
                          raw=lzma.decompress(packed)
                      except Exception:
                          continue
                      if raw[:4]==b'glTF' and len(raw) in targets:
                          breed=targets[len(raw)]
                          if breed not in found:
                              (root/(breed+'.glb')).write_bytes(raw)
                              found[breed]=(idx,len(raw))
                              lines.append(f'combo={idx} out={len(raw)} breed={breed}')

          diag=['VALID RECONSTRUCTIONS:']+lines+['','FOUND:']+[f'{k}: {v}' for k,v in sorted(found.items())]
          Path('cat-combo-diag.txt').write_text('\n'.join(diag)+'\n')
          print('\n'.join(diag))
          PY

          mkdir -p assets/cats/user-pack
          for breed in siamese maine_coon russian_blue bengal sphynx; do
            if [ -f "/tmp/catrecon/$breed.glb" ]; then
              cp "/tmp/catrecon/$breed.glb" "assets/cats/user-pack/printed_cat_$breed.glb"
            fi
          done

      - name: Commit reconstruction results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-combo-diag.txt assets/cats/user-pack 2>/dev/null || true
          git commit -m 'Reconstruct uploaded cat GLB blobs' || exit 0
          git push

# reconstruction-trigger-1
