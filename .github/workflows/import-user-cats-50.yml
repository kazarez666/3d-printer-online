name: Diagnose user cat blobs 5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-cats-50.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect orphan blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -f cat-import-diag.txt
          touch cat-import-diag.txt
          CANDIDATES=(
            b21e9405e8935998a67ccb745e64abdecfb11096
            cb1e04bbb87344aab90d77ba9de9c4f773e06ebb
            ea0f5cc84d6af7bed8403fc0895ec3c0cd06ebfd
            795d0b5cbdd76017296afa17e6e75667d74a8b63
            e2c2f930dac06d33b4066da79d3a9777f08d6ed2
            a6d4f96b7c09fcfee00b0d9ead6cef984ed1f68f
            90fc200197d6821c872698ff674b048eeae347b6
            b3c3b985ca85475ae9e247b4ef87957b815e68cf
            e4740591351eb7a3c982955080a792ef4d9aae92
            3066a48dc55e4d953323f9b599690e3365d18fe4
            56429f985be01a3ea2fa7e218188ff64efd2eba7
            8f77d674da6b929297bb06d69fc3ec9c8bea1f77
            a0fb7955d403a6672cc45c382f99d93dda90a434
            cfe5b3916f96436de0126564709f33bde2850fe9
            fcbcbdb11cafdc9b02912cecd7e04cb0b12a1ac6
            b6525d7347ea64babe84ffef52a5dd0518b42784
          )
          mkdir -p /tmp/catdiag
          for sha in "${CANDIDATES[@]}"; do
            json=/tmp/catdiag/$sha.json
            raw=/tmp/catdiag/$sha.raw
            out=/tmp/catdiag/$sha.out
            code=$(curl -sS -o "$json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha")
            if [ "$code" != 200 ]; then
              echo "$sha HTTP=$code" >> cat-import-diag.txt
              continue
            fi
            jq -r '.content' "$json" | tr -d '\n' | base64 -d > "$raw"
            rawsize=$(stat -c%s "$raw" 2>/dev/null || echo 0)
            rawmagic=$(xxd -p -l 8 "$raw" 2>/dev/null || true)
            cp "$raw" "$out"
            if [ "$(xxd -p -l 6 "$raw")" = "fd377a585a00" ]; then
              xz -dc "$raw" > "$out" 2>/dev/null
            fi
            outsize=$(stat -c%s "$out" 2>/dev/null || echo 0)
            outmagic=$(xxd -p -l 12 "$out" 2>/dev/null || true)
            echo "$sha raw=$rawsize rawmagic=$rawmagic out=$outsize outmagic=$outmagic" >> cat-import-diag.txt
          done
          cat cat-import-diag.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-import-diag.txt
          git commit -m 'Diagnose uploaded cat model blobs' || exit 0
          git push

# diagnostic-trigger-1
