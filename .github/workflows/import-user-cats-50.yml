name: Recover user cat GLBs 5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-cats-50.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover every valid GLB from uploaded blob chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/catrecover
          mkdir -p /tmp/catrecover/valid
          CANDIDATES=(
            b21e9405e8935998a67ccb745e64abdecfb11096
            cb1e04bbb87344aab90d77ba9de9c4f773e06ebb
            ea0f5cc84d6af7bed8403fc0895ec3c0cd06ebfd
            795d0b5cbdd76017296afa17e6e75667d74a8b63
            e2c2f930dac06d33b4066da79d3a9777f08d6ed2
            a6d4f96b7c09fcfee00b0d9ead6cef984ed1f68f
            90fc200197d6821c872698ff674b048eeae347b6
            b3c3b985ca85475ae9e247b4ef87957b815e68cf
            e4740591351eb7a3c982955080a792ef4d9aae92
            3066a48dc55e4d953323f9b599690e3365d18fe4
            56429f985be01a3ea2fa7e218188ff64efd2eba7
            8f77d674da6b929297bb06d69fc3ec9c8bea1f77
            a0fb7955d403a6672cc45c382f99d93dda90a434
            cfe5b3916f96436de0126564709f33bde2850fe9
            fcbcbdb11cafdc9b02912cecd7e04cb0b12a1ac6
            b6525d7347ea64babe84ffef52a5dd0518b42784
          )
          : > /tmp/catrecover/list.txt
          for sha in "${CANDIDATES[@]}"; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/catrecover/$sha.txt"
            echo "$sha" >> /tmp/catrecover/list.txt
          done

          python - <<'PY'
          from pathlib import Path
          import base64, lzma, itertools, hashlib, json, struct

          root=Path('/tmp/catrecover')
          shas=root.joinpath('list.txt').read_text().splitlines()
          parts=[root.joinpath(s+'.txt').read_bytes() for s in shas]
          starts=[i for i,p in enumerate(parts) if p.startswith(b'/Td6WFo')]
          seen={}
          attempts=0

          def parse_glb(raw):
              if len(raw)<20 or raw[:4]!=b'glTF': return None
              magic,version,total=struct.unpack_from('<4sII',raw,0)
              if version!=2 or total!=len(raw): return None
              clen,ctype=struct.unpack_from('<II',raw,12)
              if ctype!=0x4E4F534A or 20+clen>len(raw): return None
              try:
                  doc=json.loads(raw[20:20+clen].decode('utf-8').rstrip(' \t\r\n\0'))
              except Exception:
                  return None
              return doc

          for start in starts:
              later=list(range(start+1,len(parts)))
              # Up to 7 continuation chunks.  All earlier uploads were split into small pieces,
              # and this covers interleaved upload order while keeping runtime bounded.
              for tails_n in range(0,min(7,len(later))+1):
                  for tail in itertools.combinations(later,tails_n):
                      idx=(start,)+tail
                      compact=b''.join(b''.join(parts[k].split()) for k in idx)
                      if len(compact)>180000 or len(compact)%4==1:
                          continue
                      attempts+=1
                      try:
                          packed=base64.b64decode(compact,validate=True)
                          if not packed.startswith(b'\xfd7zXZ\x00'):
                              continue
                          raw=lzma.decompress(packed)
                      except Exception:
                          continue
                      doc=parse_glb(raw)
                      if doc is None:
                          continue
                      digest=hashlib.sha256(raw).hexdigest()
                      if digest in seen:
                          continue
                      names=[]
                      for key in ('scenes','nodes','meshes','materials'):
                          for item in doc.get(key,[]) or []:
                              n=item.get('name') if isinstance(item,dict) else None
                              if n: names.append(f'{key}:{n}')
                      asset=doc.get('asset',{})
                      summary={
                          'indices':idx,
                          'blob_shas':[shas[k] for k in idx],
                          'base64_chars':len(compact),
                          'xz_bytes':len(packed),
                          'glb_bytes':len(raw),
                          'sha256':digest,
                          'asset':asset,
                          'names':names[:40],
                          'scene':doc.get('scene'),
                          'mesh_count':len(doc.get('meshes',[]) or []),
                          'node_count':len(doc.get('nodes',[]) or []),
                          'material_count':len(doc.get('materials',[]) or []),
                      }
                      seen[digest]=summary
                      (root/'valid'/f'{digest[:12]}.glb').write_bytes(raw)

          report={'attempts':attempts,'start_indices':starts,'valid_count':len(seen),'valid':list(seen.values())}
          Path('cat-recovery-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY

          rm -rf assets/cats/recovered-upload
          mkdir -p assets/cats/recovered-upload
          cp /tmp/catrecover/valid/*.glb assets/cats/recovered-upload/ 2>/dev/null || true

      - name: Commit recovered models and report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-recovery-report.json assets/cats/recovered-upload
          git commit -m 'Recover valid uploaded cat GLBs' || exit 0
          git push

