name: Vendor 3D runtime 3.6.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-runtime-361.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor pinned Three.js runtime and switch app to local scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fL --retry 4 --retry-delay 2 -o vendor/three.min.js https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js
          curl -fL --retry 4 --retry-delay 2 -o vendor/GLTFLoader.js https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js
          curl -fL --retry 4 --retry-delay 2 -o vendor/OBJLoader.js https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js
          test -s vendor/three.min.js
          test -s vendor/GLTFLoader.js
          test -s vendor/OBJLoader.js
          python3 -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(); assert \"const APP_VERSION='3.6';\" in s; p.write_text(s.replace(\"const APP_VERSION='3.6';\",\"const APP_VERSION='3.6.1';\",1))"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('Test Build 3.6','Test Build 3.6.1').replace('CAT COLOR BUILD 3.6','STABLE RUNTIME BUILD 3.6.1').replace('style.css?v=3.6','style.css?v=3.6.1').replace('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','vendor/three.min.js?v=3.6.1').replace('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','vendor/GLTFLoader.js?v=3.6.1').replace('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js','vendor/OBJLoader.js?v=3.6.1').replace('app.js?v=3.6','app.js?v=3.6.1'); p.write_text(s)"
          printf '{"version":"3.6.1"}\n' > version.json
          node --check app.js
          grep -q "APP_VERSION='3.6.1'" app.js
          grep -q 'vendor/three.min.js?v=3.6.1' index.html
          grep -q 'vendor/OBJLoader.js?v=3.6.1' index.html
          grep -q 'vendor/GLTFLoader.js?v=3.6.1' index.html
          ! grep -q 'cdnjs.cloudflare.com' index.html
          ! grep -q 'cdn.jsdelivr.net' index.html
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vendor-runtime-361.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html version.json vendor .github/workflows/vendor-runtime-361.yml
          git commit -m 'Fix 3.6.1 self-host 3D runtime to prevent endless loading'
          git push
