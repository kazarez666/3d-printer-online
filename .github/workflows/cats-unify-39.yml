name: Connected cat meshes 3.9 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cats-unify-39.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate visually unified low-poly cats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import math

          OUT=Path('assets/cats'); OUT.mkdir(parents=True,exist_ok=True)

          def norm(v):
              l=math.sqrt(sum(x*x for x in v)) or 1
              return tuple(x/l for x in v)
          def cross(a,b): return (a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0])
          def sub(a,b): return tuple(a[i]-b[i] for i in range(3))
          def add(a,b): return tuple(a[i]+b[i] for i in range(3))
          def mul(a,s): return tuple(x*s for x in a)

          class Obj:
              def __init__(self): self.v=[]; self.parts=[]
              def part(self,name):
                  p={'name':name,'faces':[]}; self.parts.append(p); return p
              def verts(self,pts):
                  ids=[]
                  for p in pts: self.v.append(p); ids.append(len(self.v))
                  return ids
              def tri(self,p,a,b,c): p['faces'].append((a,b,c))
              def quad(self,p,a,b,c,d): self.tri(p,a,b,c); self.tri(p,a,c,d)
              def loft_z(self,name,sections,sides=8):
                  p=self.part(name); rings=[]
                  for z,cy,rx,ry in sections:
                      pts=[]
                      for i in range(sides):
                          a=2*math.pi*i/sides
                          pts.append((rx*math.cos(a),cy+ry*math.sin(a),z))
                      rings.append(self.verts(pts))
                  for r in range(len(rings)-1):
                      A,B=rings[r],rings[r+1]
                      for i in range(sides): self.quad(p,A[i],A[(i+1)%sides],B[(i+1)%sides],B[i])
                  c0=self.verts([(0,sections[0][1],sections[0][0])])[0]
                  c1=self.verts([(0,sections[-1][1],sections[-1][0])])[0]
                  for i in range(sides):
                      self.tri(p,c0,rings[0][(i+1)%sides],rings[0][i])
                      self.tri(p,c1,rings[-1][i],rings[-1][(i+1)%sides])
              def tube(self,name,points,radii,sides=6):
                  p=self.part(name); rings=[]
                  for j,c in enumerate(points):
                      if j==0:t=sub(points[1],points[0])
                      elif j==len(points)-1:t=sub(points[-1],points[-2])
                      else:t=sub(points[j+1],points[j-1])
                      t=norm(t); ref=(0,1,0) if abs(t[1])<.88 else (1,0,0)
                      n1=norm(cross(t,ref)); n2=norm(cross(t,n1)); r=radii[j]
                      pts=[add(c,add(mul(n1,math.cos(2*math.pi*i/sides)*r),mul(n2,math.sin(2*math.pi*i/sides)*r))) for i in range(sides)]
                      rings.append(self.verts(pts))
                  for r in range(len(rings)-1):
                      A,B=rings[r],rings[r+1]
                      for i in range(sides): self.quad(p,A[i],A[(i+1)%sides],B[(i+1)%sides],B[i])
                  c0=self.verts([points[0]])[0]; c1=self.verts([points[-1]])[0]
                  for i in range(sides):
                      self.tri(p,c0,rings[0][(i+1)%sides],rings[0][i])
                      self.tri(p,c1,rings[-1][i],rings[-1][(i+1)%sides])
              def wedge_ear(self,name,cx,wide,tall,front,back,basey):
                  p=self.part(name)
                  pts=[(cx-wide,basey,front),(cx+wide,basey,front),(cx+wide*.78,basey+.035,back),(cx-wide*.78,basey+.035,back),(cx,basey+tall,(front+back)*.5)]
                  a,b,c,d,e=self.verts(pts)
                  self.quad(p,a,b,c,d); self.tri(p,a,e,b); self.tri(p,b,e,c); self.tri(p,c,e,d); self.tri(p,d,e,a)
              def plate_z(self,name,cx,cy,z,rx,ry,depth=.010,sides=6):
                  p=self.part(name); F=[];B=[]
                  for i in range(sides):
                      a=2*math.pi*i/sides
                      F.append((cx+rx*math.cos(a),cy+ry*math.sin(a),z+depth)); B.append((cx+rx*math.cos(a),cy+ry*math.sin(a),z-depth))
                  f=self.verts(F); b=self.verts(B)
                  for i in range(1,sides-1): self.tri(p,f[0],f[i],f[i+1]); self.tri(p,b[0],b[i+1],b[i])
                  for i in range(sides): self.quad(p,f[i],b[i],b[(i+1)%sides],f[(i+1)%sides])
              def plate_x(self,name,x,cy,cz,ry,rz,depth=.010,sides=6):
                  p=self.part(name); A=[];B=[]
                  for i in range(sides):
                      a=2*math.pi*i/sides; y=cy+ry*math.cos(a); z=cz+rz*math.sin(a)
                      A.append((x+depth,y,z));B.append((x-depth,y,z))
                  f=self.verts(A);b=self.verts(B)
                  for i in range(1,sides-1):self.tri(p,f[0],f[i],f[i+1]);self.tri(p,b[0],b[i+1],b[i])
                  for i in range(sides):self.quad(p,f[i],b[i],b[(i+1)%sides],f[(i+1)%sides])
              def text(self):
                  out=['# 3D Printer Online connected low-poly cat 3.9']
                  for x,y,z in self.v: out.append(f'v {x:.6f} {y:.6f} {z:.6f}')
                  for p in self.parts:
                      out.append('o '+p['name']);out.append('g '+p['name'])
                      for f in p['faces']:out.append('f '+' '.join(map(str,f)))
                  return '\n'.join(out)+'\n'

          PRESETS={
            'british':dict(w=.36,l=.73,by=.76,bh=.35,hw=.30,hh=.29,leg=.47,ear=.33,tail=.072),
            'siamese':dict(w=.245,l=.82,by=.79,bh=.29,hw=.245,hh=.245,leg=.58,ear=.44,tail=.043),
            'tabby':dict(w=.30,l=.78,by=.78,bh=.32,hw=.275,hh=.265,leg=.52,ear=.37,tail=.053),
            'maine':dict(w=.33,l=.88,by=.81,bh=.34,hw=.31,hh=.295,leg=.55,ear=.43,tail=.086),
            'bengal':dict(w=.255,l=.86,by=.80,bh=.29,hw=.245,hh=.245,leg=.58,ear=.38,tail=.048),
          }

          def build(filename,kind):
              P=PRESETS[kind];o=Obj();w,l,by,bh=P['w'],P['l'],P['by'],P['bh'];hw,hh=P['hw'],P['hh']
              # ONE continuous main loft: rear torso -> chest -> neck -> head -> muzzle.
              sections=[
                (-l,by-.01,w*.74,bh*.72),
                (-l*.62,by,w*.97,bh*.98),
                (-l*.18,by+.025,w,bh),
                (l*.28,by+.05,w*.88,bh*.94),
                (l*.58,by+.10,w*.70,bh*.82),
                (l*.76,1.00,hw*.68,hh*.72),
                (l*.88,1.14,hw*.84,hh*.90),
                (l+0.10,1.22,hw,hh),
                (l+0.30,1.20,hw*.86,hh*.84),
                (l+0.46,1.10,hw*.45,hh*.36),
              ]
              o.loft_z('cat_body',sections,8)

              # Ears sink deep into the head so the bases disappear inside the main mesh.
              ex=hw*.55
              o.wedge_ear('cat_body_ear_left',-ex,hw*.40,P['ear'],l+0.22,l+0.02,1.30)
              o.wedge_ear('cat_body_ear_right',ex,hw*.40,P['ear'],l+0.22,l+0.02,1.30)

              # Legs start deep inside torso and paws are CONTINUATIONS of each leg tube (no separate paw blocks).
              bottom=.10
              for side in (-1,1):
                  x=side*w*.50
                  for z,tag in ((l*.38,'front'),(-l*.45,'rear')):
                      root=(x,by+.01,z)
                      hip=(x,by-.18,z)
                      knee=(x*(1.02 if tag=='rear' else .99),bottom+P['leg']*.52,z+(-.04 if tag=='rear' else .025))
                      ankle=(x,bottom+.10,z+(.02 if tag=='front' else -.025))
                      toe=(x,bottom*.78,z+(.11 if tag=='front' else .055))
                      o.tube('cat_body_leg_'+tag+('_L' if side<0 else '_R'),[root,hip,knee,ankle,toe],[w*.22,w*.17,w*.115,w*.10,w*.13],6)

              # Tail root also begins INSIDE torso before flowing outward.
              tr=P['tail']
              if kind=='british':
                  pts=[(-w*.18,by,-l*.52),(-w*.32,by+.03,-l*.73),(-w*.52,by+.19,-l-.10),(-w*.50,by+.40,-l-.28),(-w*.27,by+.50,-l-.35)]
              elif kind=='maine':
                  pts=[(-w*.18,by,-l*.54),(-w*.32,by+.03,-l*.76),(-w*.58,by+.20,-l-.14),(-w*.64,by+.45,-l-.38),(-w*.38,by+.68,-l-.50),(-.02,by+.78,-l-.42)]
              else:
                  pts=[(-w*.16,by,-l*.54),(-w*.30,by+.03,-l*.76),(-w*.50,by+.17,-l-.18),(-w*.50,by+.39,-l-.38),(-w*.30,by+.59,-l-.52),(0,by+.67,-l-.48)]
              rads=[tr*1.28,tr*1.15,tr,tr*.82,tr*.62]+([tr*.46] if len(pts)==6 else [])
              o.tube('cat_body_tail',pts,rads,6)

              facez=l+.50
              o.plate_z('detail_eye_left',-hw*.34,1.24,facez,hw*.10,hh*.07,.008,5)
              o.plate_z('detail_eye_right',hw*.34,1.24,facez,hw*.10,hh*.07,.008,5)
              o.plate_z('detail_nose',0,1.075,facez+.012,hw*.11,hh*.07,.009,4)

              if kind=='siamese':
                  o.plate_z('mark_dark_mask',0,1.16,facez-.005,hw*.62,hh*.50,.012,6)
                  for side in (-1,1):
                      x=side*w*.50
                      for z,tag in ((l*.43,'f'),(-l*.48,'r')):
                          o.plate_x(f'mark_dark_paw_{tag}_{side}',side*(abs(x)+.004),.15,z+.055,.055,.095,.008,5)
              elif kind=='tabby':
                  for side in (-1,1):
                      x=side*(w+.006)
                      for j,(zv,yv,rz) in enumerate([(-.42,.82,.10),(-.16,.88,.09),(.10,.91,.08),(.35,.95,.07)]):
                          o.plate_x(f'mark_dark_stripe_{side}_{j}',x,yv,zv,w*.035,rz,.008,4)
                  o.plate_z('mark_dark_forehead',0,1.36,facez-.005,hw*.10,hh*.14,.010,4)
              elif kind=='maine':
                  o.plate_z('mark_cream_chest',0,.88,l*.61,hw*.66,bh*.30,.010,6)
                  for side in (-1,1):o.plate_x(f'mark_dark_flank_{side}',side*(w+.006),.90,-.08,bh*.18,.15,.008,5)
              elif kind=='bengal':
                  spots=[(-.52,.80,.12),(-.28,.91,.11),(-.04,.79,.10),(.20,.91,.11),(.43,.81,.10),(-.38,1.01,.09),(-.10,1.04,.10),(.18,1.02,.09),(.43,1.00,.085)]
                  for side in (-1,1):
                      x=side*(w+.008)
                      for j,(zv,yv,r) in enumerate(spots):
                          o.plate_x(f'mark_dark_spot_{side}_{j}',x,yv,zv,r*.70,r,.010,6)
                          if j%2==0:o.plate_x(f'mark_warm_spot_{side}_{j}',side*(w+.019),yv,zv,r*.32,r*.47,.009,6)
                  o.plate_z('mark_cream_chest',0,.88,l*.62,hw*.55,bh*.23,.010,6)
              elif kind=='british':
                  o.plate_z('mark_cream_chest',0,.87,l*.60,hw*.48,bh*.18,.009,6)

              (OUT/filename).write_text(o.text())

          build('BritishShorthair.obj','british')
          build('SiameseCat.obj','siamese')
          build('OrangeTabby.obj','tabby')
          build('MaineCoon.obj','maine')
          build('BengalCat.obj','bengal')
          Path('assets/cats/README.txt').write_text('3.9 connected visual topology: continuous torso-neck-head-muzzle loft, integrated leg-to-paw tubes, deeply embedded tail/ear roots.\n')
          PY

      - name: Bump app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js');s=p.read_text()
          if "const APP_VERSION='3.8';" not in s: raise SystemExit('Expected app.js 3.8')
          p.write_text(s.replace("const APP_VERSION='3.8';","const APP_VERSION='3.9';",1))
          h=Path('app.html').read_text()
          if '3.8' not in h: raise SystemExit('Expected app.html 3.8')
          h=h.replace('3.8','3.9').replace('ANGULAR CAT MESH BUILD 3.9','CONNECTED CAT BUILD 3.9').replace('AUTHORED CAT MESH BUILD 3.9','CONNECTED CAT BUILD 3.9')
          Path('app.html').write_text(h)
          Path('version.json').write_text('{"version":"3.9"}\n')
          PY
          node --check app.js

      - name: Commit connected cats
        shell: bash
        run: |
          rm .github/workflows/cats-unify-39.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cats app.js app.html version.json .github/workflows/cats-unify-39.yml
          git commit -m 'Cats 3.9 connect body paws legs head and tail'
          git push
