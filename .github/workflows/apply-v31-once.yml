name: Apply Rebuild 3.1 once
on:
  push:
    paths:
      - .github/workflows/apply-v31-once.yml
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Rebuild 3.1 once'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build real Tiny Pack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q gdown
          rm -rf assets
          mkdir -p assets/pets/Textures assets/dinos

          # Kenney Cube Pets — CC0. Real GLB meshes for cat / lion / tiger.
          curl -fL --retry 3 --retry-delay 2 'https://kenney.nl/media/pages/assets/cube-pets/44e58e945f-1774520254/kenney_cube-pets_1.0.zip' -o /tmp/cube.zip
          rm -rf /tmp/cube && mkdir -p /tmp/cube
          unzip -q /tmp/cube.zip -d /tmp/cube
          cp '/tmp/cube/Models/GLB format/animal-cat.glb' assets/pets/animal-cat.glb
          cp '/tmp/cube/Models/GLB format/animal-lion.glb' assets/pets/animal-lion.glb
          cp '/tmp/cube/Models/GLB format/animal-tiger.glb' assets/pets/animal-tiger.glb
          cp '/tmp/cube/Models/GLB format/Textures/colormap.png' assets/pets/Textures/colormap.png

          # Quaternius Animated Dinosaur Pack — CC0. Real OBJ meshes.
          gdown 'https://drive.google.com/uc?id=1DczBJrwP7kAYb_gzKyzcEQk0iu9MXty9' -O assets/dinos/Parasaurolophus.obj
          gdown 'https://drive.google.com/uc?id=1xxSCWNsbzgIUwO-vFs7IzeLgkLEeHvoH' -O assets/dinos/Stegosaurus.obj
          gdown 'https://drive.google.com/uc?id=13-Ir34RY84AFWwaZgN01Dn7lFVT4p7xY' -O assets/dinos/Apatosaurus.obj
          gdown 'https://drive.google.com/uc?id=1wQRHlhj0bn300ATAFJFtB8AAzzai3MfO' -O assets/dinos/Triceratops.obj
          gdown 'https://drive.google.com/uc?id=1FzvEHFDaca8wsOmdd7SdU9kv6GF2Ajy0' -O assets/dinos/Velociraptor.obj
          gdown 'https://drive.google.com/uc?id=1bi_m7-UVChLqYfe_uaXEPTLZRqGYpfpO' -O assets/dinos/Trex.obj

          # OpenGameArt Steamer Duck — CC0. Real OBJ mesh.
          curl -fL --retry 3 --retry-delay 2 'https://opengameart.org/sites/default/files/duck3d.obj' -o assets/duck.obj

          # Fix model-root reveal position before publishing.
          python - <<'PY'
          from pathlib import Path
          p=Path('staging-v31/app.js')
          s=p.read_text()
          s=s.replace("modelRoot.rotation.set(0,0,0);state='printing'","modelRoot.rotation.set(0,0,0);modelRoot.position.y=BED_Y;state='printing'")
          s=s.replace("modelRoot.position.y=0;ui.bar.style.width='0%'","modelRoot.position.y=BED_Y;ui.bar.style.width='0%'")
          s=s.replace("modelRoot.position.y=Math.sin(now*.0032)*.018","modelRoot.position.y=BED_Y+Math.sin(now*.0032)*.018")
          s=s.replace("}else{modelRoot.position.y*=.9}}renderer.render","}else{modelRoot.position.y+=(BED_Y-modelRoot.position.y)*Math.min(1,dt*4)}}renderer.render")
          p.write_text(s)
          PY

          node --check staging-v31/app.js
          grep -q "APP_VERSION='3.1'" staging-v31/app.js
          grep -q 'REAL ASSET BUILD 3.1' staging-v31/index.html
          grep -q '"3.1"' staging-v31/version.json
          test -s assets/pets/animal-cat.glb
          test -s assets/pets/animal-lion.glb
          test -s assets/pets/animal-tiger.glb
          test -s assets/pets/Textures/colormap.png
          test -s assets/duck.obj
          for f in assets/dinos/*.obj; do grep -q '^v ' "$f"; done

          cp staging-v31/index.html index.html
          cp staging-v31/style.css style.css
          cp staging-v31/app.js app.js
          cp staging-v31/version.json version.json
          cat > THIRD_PARTY_ASSETS.md <<'EOF'
          # Third-party 3D assets

          - Kenney Cube Pets: CC0 1.0 — cat, lion, tiger meshes and colormap.
          - Quaternius Animated Dinosaur Pack: CC0 1.0 — Apatosaurus, Parasaurolophus, Stegosaurus, T-Rex, Triceratops, Velociraptor meshes.
          - OpenGameArt Steamer Duck 3D: CC0 1.0 — duck mesh.
          EOF
      - name: Commit 3.1 and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging-v31
          rm -f .github/workflows/apply-v31-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rebuild 3.1 real Tiny Pack'
          git push
