name: Cats and duck polish 3.6 once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cats-colors-36.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply visual polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('app.js')
          s=p.read_text()
          assert "const APP_VERSION='3.5';" in s
          s=s.replace("const APP_VERSION='3.5';","const APP_VERSION='3.6';",1)
          reps=[
            ("{id:'british',name:'British Shorthair',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/BritishShorthair.obj',tint:0xaeb9c8,target:1.52,max:2.25}","{id:'british',name:'British Shorthair',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/BritishShorthair.obj',tint:0xaeb9c8,target:1.52,max:2.25,shape:[.94,1,.90]}"),
            ("{id:'siamese',name:'Siamese Cat',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/SiameseCat.obj',tint:0xe7d3ad,target:1.58,max:2.25}","{id:'siamese',name:'Siamese Cat',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/SiameseCat.obj',tint:0xe7d3ad,target:1.58,max:2.25,shape:[.84,1.03,.84]}"),
            ("{id:'tabby',name:'Orange Tabby',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/OrangeTabby.obj',tint:0xde8741,target:1.54,max:2.25}","{id:'tabby',name:'Orange Tabby',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/OrangeTabby.obj',tint:0xde8741,target:1.54,max:2.25,shape:[.90,1,.88]}"),
            ("{id:'maine',name:'Maine Coon',rarity:'Rare',value:25,weight:18,type:'obj',src:'assets/cats/MaineCoon.obj',tint:0x827870,target:1.64,max:2.30}","{id:'maine',name:'Maine Coon',rarity:'Rare',value:25,weight:18,type:'obj',src:'assets/cats/MaineCoon.obj',tint:0x827870,target:1.64,max:2.30,shape:[.91,1.02,.89]}"),
            ("{id:'bengal',name:'Bengal Leopard Cat',rarity:'Legendary',value:50,weight:7,type:'obj',src:'assets/cats/BengalCat.obj',tint:0xd69a47,target:1.60,max:2.30}","{id:'bengal',name:'Bengal Leopard Cat',rarity:'Legendary',value:50,weight:7,type:'obj',src:'assets/cats/BengalCat.obj',tint:0xd69a47,target:1.60,max:2.30,shape:[.82,1.04,.80]}")]
          for old,new in reps:
              assert old in s
              s=s.replace(old,new,1)
          bengal_lines=[" if(v.breed==='bengal'){","   const spot=detailMaterial(0x4b2e1d,.54),inner=detailMaterial(0xd7a15c,.66);","   const rosette=(px,py,side=1,sc=1)=>{const z=side>0?b.max.z+sz.z*.014:b.min.z-sz.z*.014;addSphere(spot,c.x+sz.x*px,b.min.y+sz.y*py,z,.30*sc,.22*sc,.085);addSphere(inner,c.x+sz.x*px,b.min.y+sz.y*py,z+(side>0?sz.z*.012:-sz.z*.012),.145*sc,.105*sc,.055)};","   const pts=[[-.28,.55,1,1],[-.10,.59,1,.9],[.10,.55,1,.9],[.27,.62,1,.95],[-.22,.70,1,.85],[-.02,.73,1,1],[.20,.76,1,.82],[-.27,.84,1,.78],[-.08,.88,1,.75],[.16,.91,1,.72],[-.26,.57,-1,.9],[-.06,.61,-1,1],[.16,.57,-1,.85],[.28,.68,-1,.9],[-.18,.74,-1,.82],[.03,.78,-1,.92],[.22,.84,-1,.74],[-.10,.89,-1,.72]];","   pts.forEach(q=>rosette(q[0],q[1],q[2],q[3]));","   addBox(spot,c.x-sz.x*.12,headY+sz.y*.06,front+sz.z*.012,.20,.10,.08,-.15);addBox(spot,c.x+sz.x*.10,headY+sz.y*.09,front+sz.z*.012,.18,.09,.08,.14);"," }"]
          s,n=re.subn(r" if\(v\.breed==='bengal'\)\{\n   const pts=.*?\n \}","\n".join(bengal_lines),s,count=1,flags=re.S)
          assert n==1
          duck_lines=["function addDuckDetails(raw,v){"," const b=new THREE.Box3().setFromObject(raw),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());"," const front=b.max.z+sz.z*.012,headY=b.min.y+sz.y*.78,bodyY=b.min.y+sz.y*.48;"," const isUgly=v.id==='ugly';"," const beak=detailMaterial(isUgly?0xc17b45:0xf28c28,.48),eye=detailMaterial(0x12161a,.45),wing=detailMaterial(isUgly?0x161a20:0xd9a71f,.62),belly=detailMaterial(isUgly?0x747d88:0xffe59a,.68),feet=detailMaterial(isUgly?0xb87945:0xe87924,.55),cheek=detailMaterial(isUgly?0x9098a3:0xffefad,.72);"," const addSphere=(mat,x,y,z,sx,sy,szc)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.1,14,10),mat);m.position.set(x,y,z);m.scale.set(sx,sy,szc);m.castShadow=true;raw.add(m);return m};"," const bill=new THREE.Mesh(new THREE.BoxGeometry(sz.x*.24,sz.y*.075,sz.z*.17),beak);bill.position.set(c.x,headY-sz.y*.04,front+sz.z*.05);bill.castShadow=true;raw.add(bill);"," for(const x of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(sz.x*.035,10,8),eye);e.position.set(c.x+x*sz.x*.12,headY+sz.y*.08,front+sz.z*.012);e.scale.z=.62;e.castShadow=true;raw.add(e)}"," addSphere(wing,c.x-sz.x*.31,bodyY,c.z,sz.x*2.2,sz.y*.72,sz.z*1.25);addSphere(wing,c.x+sz.x*.31,bodyY,c.z,sz.x*2.2,sz.y*.72,sz.z*1.25);"," addSphere(belly,c.x,bodyY+sz.y*.04,front+sz.z*.004,sz.x*2.4,sz.y*1.7,sz.z*.34);"," addSphere(cheek,c.x-sz.x*.13,headY-sz.y*.02,front+sz.z*.015,sz.x*.62,sz.y*.38,sz.z*.22);addSphere(cheek,c.x+sz.x*.13,headY-sz.y*.02,front+sz.z*.015,sz.x*.62,sz.y*.38,sz.z*.22);"," addSphere(feet,c.x-sz.x*.16,b.min.y+sz.y*.04,c.z+sz.z*.13,sz.x*.95,sz.y*.28,sz.z*.75);addSphere(feet,c.x+sz.x*.16,b.min.y+sz.y*.04,c.z+sz.z*.13,sz.x*.95,sz.y*.28,sz.z*.75);","}"]
          s,n=re.subn(r"function addDuckDetails\(raw,v\)\{\n.*?\n\}","\n".join(duck_lines),s,count=1,flags=re.S)
          assert n==1
          p.write_text(s)
          h=Path('index.html').read_text()
          h=h.replace('Test Build 3.5','Test Build 3.6').replace('CAT POLISH BUILD 3.5','CAT COLOR BUILD 3.6').replace('style.css?v=3.5','style.css?v=3.6').replace('app.js?v=3.5','app.js?v=3.6')
          Path('index.html').write_text(h)
          Path('version.json').write_text(json.dumps({'version':'3.6'})+'\n')
          PY
          node --check app.js
          grep -q "APP_VERSION='3.6'" app.js
          grep -q 'shape:\[.82,1.04,.80\]' app.js
          grep -q 'CAT COLOR BUILD 3.6' index.html
      - name: Commit 3.6
        run: |
          rm -f .github/workflows/cats-colors-36.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish 3.6 slimmer cats Bengal spots painted ducks'
          git push
