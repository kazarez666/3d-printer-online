name: Inspect dinosaur files once
on:
  push:
    paths:
      - .github/workflows/inspect-dino-files-once.yml
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect dinosaur files once'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and list Quaternius dinosaurs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q gdown
          mkdir -p /tmp/dino
          gdown --folder 'https://drive.google.com/drive/folders/1u5Fhu3ziuRlGonW6bUI7uClqBGoSNeF6?usp=sharing' -O /tmp/dino
          find /tmp/dino -maxdepth 5 -type f | sort | sed -n '1,260p'
      - name: Self delete
        shell: bash
        run: |
          rm -f .github/workflows/inspect-dino-files-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove dinosaur file inspection workflow' || true
          git push
