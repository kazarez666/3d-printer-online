name: Add Prototype 0.9 slow motion
on:
  push:
    paths:
      - '.github/workflows/add-time-01.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 0.1x time scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Prototype 0.8','Prototype 0.9')
          s=s.replace('id="versionLabel">0.8<','id="versionLabel">0.9<')
          s=s.replace("const APP_VERSION='0.8'","const APP_VERSION='0.9'")
          s=s.replace('TIME_SCALES=[1,.5,.25]','TIME_SCALES=[1,.5,.25,.1]')
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.9"\n}\n')
          PY
      - name: Commit Prototype 0.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Prototype 0.9 add 0.1x slow motion" || exit 0
          git push
