name: Apply Prototype 2.5 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v25-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Prototype 2.5 once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh tooling
        run: python -m pip install --quiet numpy scikit-image trimesh
      - name: Generate real Tiny Pack meshes and patch runtime
        run: |
          mkdir -p assets/tiny
          python tools/generate_tiny_meshes.py assets/tiny
          python - <<'PY'
          from pathlib import Path

          p=Path('asset25.js'); s=p.read_text()
          s=s.replace("roughness:(v.kind==='siamese'||v.kind==='bengal')?.38:.44","roughness:(v.kind==='siamese'||v.kind==='bengal')?0.38:0.44")
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=s.replace('Prototype 2.4','Prototype 2.5').replace('style.css?v=2.4','style.css?v=2.5')
          old='<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="core.js?v=2.4"></script><script src="models.js?v=2.4"></script><script src="game.js?v=2.4"></script><script src="visual24.js?v=2.4"></script>'
          new='<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script src="core.js?v=2.5"></script><script src="models.js?v=2.5"></script><script src="asset25.js?v=2.5"></script><script src="game.js?v=2.5"></script>'
          if old not in s: raise SystemExit('index script sequence not found')
          p.write_text(s.replace(old,new))

          p=Path('core.js'); s=p.read_text()
          s=s.replace("const APP_VERSION='2.4';","const APP_VERSION='2.5';")
          s=s.replace('renderer.toneMappingExposure=1.08','renderer.toneMappingExposure=.92')
          s=s.replace('new THREE.HemisphereLight(0xeaf2ff,0x100c0a,1.34)','new THREE.HemisphereLight(0xeaf2ff,0x100c0a,1.16)')
          s=s.replace('new THREE.DirectionalLight(0xfffcf6,2.45)','new THREE.DirectionalLight(0xfffcf6,1.9)')
          s=s.replace('new THREE.PointLight(0xaac8ff,2.5,9,2)','new THREE.PointLight(0xaac8ff,1.25,9,2)')
          s=s.replace('new THREE.PointLight(0x69a9ff,7.2,11,2)','new THREE.PointLight(0x69a9ff,4.6,11,2)')
          s=s.replace('new THREE.PointLight(0xffbd73,2.9,8,2)','new THREE.PointLight(0xffbd73,1.45,8,2)')
          p.write_text(s)

          p=Path('game.js'); s=p.read_text()
          s=s.replace("ui.main.textContent=state==='printing'?'PRINTING…':state==='reveal'?'SOLD SOON…':'PRINT';","ui.main.textContent=state==='loading'?'LOADING MODEL…':state==='printing'?'PRINTING…':state==='reveal'?'SOLD SOON…':'PRINT';")
          s=s.replace("ui.big.textContent=state==='printing'?Math.round(prog*100)+'%':state==='reveal'?variant.name:PRINTERS[s.printer].name;","ui.big.textContent=state==='loading'?'PREPARING MODEL':state==='printing'?Math.round(prog*100)+'%':state==='reveal'?variant.name:PRINTERS[s.printer].name;")
          s=s.replace("ui.small.textContent=state==='printing'?'PRINTING LAYERS':state==='reveal'?`${variant.rar.toUpperCase()} • $${variant.value}`:'READY TO PRINT';","ui.small.textContent=state==='loading'?'LOADING SCULPT':state==='printing'?'PRINTING LAYERS':state==='reveal'?`${variant.rar.toUpperCase()} • $${variant.value}`:'READY TO PRINT';")
          old="function start(){if(state!=='idle')return;variant=roll(s.family);if(active)active.visible=false;active=getModel(variant,s.family);active.visible=true;active.rotation.set(0,0,0);active.position.y=baseY;clip.constant=baseY;elapsed=0;prog=0;state='printing';autoSold=false;nozzleGlow.intensity=4.5;revealLight.intensity=0;uiUpdate()}"
          new="async function start(){if(state!=='idle')return;variant=roll(s.family);if(active)active.visible=false;state='loading';uiUpdate();try{active=await getModelAsync(variant,s.family)}catch(e){active=getModel(variant,s.family)}active.visible=true;active.rotation.set(0,0,0);active.position.y=baseY;clip.constant=baseY;elapsed=0;prog=0;state='printing';autoSold=false;nozzleGlow.intensity=4.5;revealLight.intensity=0;uiUpdate()}"
          if old not in s: raise SystemExit('game start function not found')
          s=s.replace(old,new).replace("toast('Prototype 2.2 • visual sculpt pass');","toast('Prototype 2.5 • real mesh figurines');")
          p.write_text(s)

          Path('version.json').write_text('{"version":"2.5"}\n')
          Path('visual24.js').unlink(missing_ok=True)
          PY
          test "$(find assets/tiny -name '*.glb' | wc -l)" -eq 14
          node --check core.js
          node --check models.js
          node --check asset25.js
          node --check game.js
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v25-once.yml
          git add -A
          git commit -m 'Prototype 2.5 real mesh Tiny Pack'
          git push
