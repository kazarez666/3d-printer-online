name: Inspect animal drive once
on:
  push:
    paths:
      - .github/workflows/inspect-animal-drive-once.yml
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect animal drive once'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find animal pack Drive folder
        shell: bash
        run: |
          set -euo pipefail
          curl -fLs 'https://quaternius.com/packs/ultimateanimatedanimals.html' -o /tmp/page.html
          grep -niE 'drive.google.com|Download|download' /tmp/page.html | tail -n 80
      - name: Self delete
        shell: bash
        run: |
          rm -f .github/workflows/inspect-animal-drive-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove animal drive inspection workflow' || true
          git push
