name: Cats polish 3.5 once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: github.event.head_commit.message == 'Stage cats polish 3.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild cats and fix opaque rendering
        run: |
          cat > /tmp/polish.py <<'PY'
          from pathlib import Path
          import math, json

          ROOT=Path('.')
          CATDIR=ROOT/'assets'/'cats'
          CATDIR.mkdir(parents=True,exist_ok=True)

          class OBJ:
              def __init__(self):
                  self.lines=['# 3D Printer Online cat collectible - low poly polished OBJ']
                  self.vi=1
              def obj(self,name,verts,faces):
                  self.lines.append('o '+name)
                  for x,y,z in verts:
                      self.lines.append(f'v {x:.5f} {y:.5f} {z:.5f}')
                  base=self.vi
                  for face in faces:
                      self.lines.append('f '+' '.join(str(base+i) for i in face))
                  self.vi += len(verts)
              def ellipsoid(self,name,c,r,rings=6,segs=12):
                  cx,cy,cz=c; rx,ry,rz=r
                  v=[(cx,cy+ry,cz)]
                  for i in range(1,rings):
                      ph=math.pi*i/rings
                      for j in range(segs):
                          th=2*math.pi*j/segs
                          v.append((cx+rx*math.sin(ph)*math.cos(th),cy+ry*math.cos(ph),cz+rz*math.sin(ph)*math.sin(th)))
                  v.append((cx,cy-ry,cz)); top=0; bot=len(v)-1; f=[]
                  first=1
                  for j in range(segs): f.append((top,first+(j+1)%segs,first+j))
                  for i in range(rings-2):
                      a=1+i*segs; b=a+segs
                      for j in range(segs):
                          j2=(j+1)%segs
                          f.append((a+j,a+j2,b+j2)); f.append((a+j,b+j2,b+j))
                  last=1+(rings-2)*segs
                  for j in range(segs): f.append((last+j,last+(j+1)%segs,bot))
                  self.obj(name,v,f)
              def box(self,name,c,s):
                  cx,cy,cz=c; sx,sy,sz=s; x=sx/2;y=sy/2;z=sz/2
                  v=[(cx-x,cy-y,cz-z),(cx+x,cy-y,cz-z),(cx+x,cy+y,cz-z),(cx-x,cy+y,cz-z),(cx-x,cy-y,cz+z),(cx+x,cy-y,cz+z),(cx+x,cy+y,cz+z),(cx-x,cy+y,cz+z)]
                  f=[(0,1,2),(0,2,3),(4,6,5),(4,7,6),(0,4,5),(0,5,1),(1,5,6),(1,6,2),(2,6,7),(2,7,3),(3,7,4),(3,4,0)]
                  self.obj(name,v,f)
              def wedge_ear(self,name,x,head_y,head_z,w,h,d,lean=0):
                  # Base is deliberately buried deep inside the head. Only the upper triangle is visible.
                  y0=head_y + h*.02
                  z0=head_z + d*.05
                  tip=(x+lean, y0+h, z0+d*.05)
                  v=[(x-w,y0,z0-d),(x+w,y0,z0-d),(x+w,y0,z0+d),(x-w,y0,z0+d),tip]
                  f=[(0,1,2),(0,2,3),(0,4,1),(1,4,2),(2,4,3),(3,4,0)]
                  self.obj(name,v,f)
              def cylinder(self,name,p1,p2,r1,r2=None,segs=8):
                  if r2 is None:r2=r1
                  ax,ay,az=p1; bx,by,bz=p2
                  dx,dy,dz=bx-ax,by-ay,bz-az; L=math.sqrt(dx*dx+dy*dy+dz*dz) or 1
                  ux,uy,uz=dx/L,dy/L,dz/L
                  ref=(0,1,0) if abs(uy)<.88 else (1,0,0)
                  cx=uy*ref[2]-uz*ref[1]; cy=uz*ref[0]-ux*ref[2]; cz=ux*ref[1]-uy*ref[0]
                  cl=math.sqrt(cx*cx+cy*cy+cz*cz) or 1; cx/=cl;cy/=cl;cz/=cl
                  ex=uy*cz-uz*cy; ey=uz*cx-ux*cz; ez=ux*cy-uy*cx
                  v=[]
                  for P,r in ((p1,r1),(p2,r2)):
                      px,py,pz=P
                      for j in range(segs):
                          a=2*math.pi*j/segs; ca=math.cos(a);sa=math.sin(a)
                          v.append((px+r*(cx*ca+ex*sa),py+r*(cy*ca+ey*sa),pz+r*(cz*ca+ez*sa)))
                  v.extend([p1,p2]); c0=2*segs;c1=c0+1; f=[]
                  for j in range(segs):
                      j2=(j+1)%segs
                      f.append((j,j2,segs+j2)); f.append((j,segs+j2,segs+j))
                      f.append((c0,j2,j)); f.append((c1,segs+j,segs+j2))
                  self.obj(name,v,f)
              def save(self,path): path.write_text('\n'.join(self.lines)+'\n')

          def make_cat(filename,kind):
              o=OBJ()
              cfg={
                'british': dict(body=(.66,.72,.70), head=(.56,.50,.48), body_y=.93, head_y=1.67, head_z=.43, leg=.54, ear=(.18,.42,.15), tail=.13),
                'siamese': dict(body=(.49,.78,.72), head=(.46,.47,.42), body_y=1.00, head_y=1.77, head_z=.47, leg=.69, ear=(.16,.54,.13), tail=.085),
                'tabby':   dict(body=(.59,.73,.72), head=(.51,.49,.45), body_y=.96, head_y=1.70, head_z=.45, leg=.59, ear=(.17,.46,.14), tail=.105),
                'maine':   dict(body=(.73,.80,.82), head=(.61,.54,.52), body_y=.98, head_y=1.82, head_z=.48, leg=.61, ear=(.20,.54,.17), tail=.17),
                'bengal':  dict(body=(.53,.73,.86), head=(.47,.47,.43), body_y=.98, head_y=1.72, head_z=.51, leg=.68, ear=(.16,.48,.14), tail=.095),
              }[kind]
              br=cfg['body']; hr=cfg['head']; by=cfg['body_y']; hy=cfg['head_y']; hz=cfg['head_z']; leg=cfg['leg']; ew,eh,ed=cfg['ear']
              o.ellipsoid('body',(0,by,0),br,6,12)
              o.ellipsoid('chest',(0,by+.18,.42),(br[0]*.78,br[1]*.74,br[2]*.62),5,10)
              o.ellipsoid('head',(0,hy,hz),hr,6,12)
              # broad cheeks bridge head to muzzle and make the head feel like one sculpt
              o.ellipsoid('cheek_left',(-hr[0]*.23,hy-.10,hz+hr[2]*.72),(hr[0]*.43,hr[1]*.34,hr[2]*.25),4,9)
              o.ellipsoid('cheek_right',(hr[0]*.23,hy-.10,hz+hr[2]*.72),(hr[0]*.43,hr[1]*.34,hr[2]*.25),4,9)
              o.ellipsoid('mark_cream_muzzle',(0,hy-.16,hz+hr[2]*.92),(hr[0]*.38,hr[1]*.22,hr[2]*.15),4,9)
              # ears: base starts INSIDE the upper third of the head, eliminating the floating-ear look
              ear_base_y=hy+hr[1]*.34
              o.wedge_ear('ear_left',-hr[0]*.48,ear_base_y,hz,ew,eh,ed,-.025)
              o.wedge_ear('ear_right',hr[0]*.48,ear_base_y,hz,ew,eh,ed,.025)
              # eyes / nose
              o.ellipsoid('detail_eye_left',(-hr[0]*.25,hy+.02,hz+hr[2]*.91),(hr[0]*.085,hr[1]*.085,hr[2]*.055),3,8)
              o.ellipsoid('detail_eye_right',(hr[0]*.25,hy+.02,hz+hr[2]*.91),(hr[0]*.085,hr[1]*.085,hr[2]*.055),3,8)
              o.ellipsoid('detail_nose',(0,hy-.12,hz+hr[2]*1.04),(hr[0]*.08,hr[1]*.055,hr[2]*.05),3,8)
              # legs and paws
              lx=br[0]*.48; zf=br[2]*.38; ytop=by-br[1]*.52; ybot=.16
              for name,x,z in [('fl',-lx,zf),('fr',lx,zf),('bl',-lx,-zf),('br',lx,-zf)]:
                  o.cylinder('leg_'+name,(x,ytop,z),(x,ybot,z),br[0]*.105,br[0]*.09,8)
                  o.ellipsoid('paw_'+name,(x,.13,z),(br[0]*.15,.11,br[0]*.18),3,8)
              # tail as a connected-looking chain with heavy overlap
              r=cfg['tail']; pts=[(br[0]*.72,by+.05,-br[2]*.58),(br[0]*.96,by+.24,-br[2]*.63),(br[0]*1.02,by+.53,-br[2]*.48),(br[0]*.90,by+.77,-br[2]*.24)]
              if kind=='siamese' or kind=='bengal': pts.append((br[0]*.72,by+.98,-.02))
              if kind=='maine': pts.append((br[0]*.67,by+1.03,.03))
              for i in range(len(pts)-1): o.cylinder('tail',pts[i],pts[i+1],r*(1-i*.08),r*(.92-i*.07),8)
              o.ellipsoid('tail_tip',pts[-1],(r*1.02,r*1.05,r*1.02),3,8)
              # breed cues kept simple and low-poly
              if kind=='siamese':
                  o.ellipsoid('mark_dark_mask',(0,hy+.01,hz+hr[2]*.82),(hr[0]*.58,hr[1]*.48,hr[2]*.16),4,10)
                  # dark ears over same integrated geometry; tiny inset overlays, not separate floating ears
                  o.wedge_ear('mark_dark_ear_left',-hr[0]*.48,ear_base_y+.015,hz+.006,ew*.82,eh*.84,ed*.82,-.025)
                  o.wedge_ear('mark_dark_ear_right',hr[0]*.48,ear_base_y+.015,hz+.006,ew*.82,eh*.84,ed*.82,.025)
                  for x,z in [(-lx,zf),(lx,zf),(-lx,-zf),(lx,-zf)]: o.ellipsoid('mark_dark_paw',(x,.135,z),(br[0]*.16,.115,br[0]*.19),3,8)
              elif kind=='tabby':
                  for n,x in enumerate([-.30,-.12,.08,.28]):
                      o.box('mark_dark_stripe_'+str(n),(x,by+.45,br[2]*.66),(.055,.30,.07))
                  o.box('mark_dark_forehead',(0,hy+.20,hz+hr[2]*.92),(.06,.25,.05))
              elif kind=='maine':
                  o.ellipsoid('mark_cream_chest',(0,by+.18,br[2]*.66),(br[0]*.38,br[1]*.45,br[2]*.16),4,10)
                  # short tufts grow from ear tips, deliberately overlapping the ears
                  o.wedge_ear('ear_tuft_left',-hr[0]*.49,ear_base_y+eh*.60,hz,ew*.38,eh*.42,ed*.48,-.02)
                  o.wedge_ear('ear_tuft_right',hr[0]*.49,ear_base_y+eh*.60,hz,ew*.38,eh*.42,ed*.48,.02)
              elif kind=='bengal':
                  spots=[(-.33,1.12,.66),(-.08,1.28,.70),(.22,1.12,.69),(.34,.90,.64),(-.28,.84,.67),(.03,.72,.70),(.28,.66,.60)]
                  for i,(x,y,z) in enumerate(spots): o.ellipsoid('mark_dark_spot_'+str(i),(x,y,z),(.075,.06,.035),3,7)
              o.save(CATDIR/filename)

          make_cat('BritishShorthair.obj','british')
          make_cat('SiameseCat.obj','siamese')
          make_cat('OrangeTabby.obj','tabby')
          make_cat('MaineCoon.obj','maine')
          make_cat('BengalCat.obj','bengal')

          app=(ROOT/'app.js').read_text()
          old="const APP_VERSION='3.4';"
          if old not in app: raise SystemExit('APP_VERSION marker not found')
          app=app.replace(old,"const APP_VERSION='3.5';",1)

          old_mat="o.material=new THREE.MeshStandardMaterial({color:col,roughness:.58,metalness:.015,flatShading:true,clippingPlanes:[clip],clipShadows:true})"
          new_mat="o.material=new THREE.MeshStandardMaterial({color:col,roughness:.58,metalness:.015,flatShading:true,transparent:false,opacity:1,alphaTest:0,depthWrite:true,depthTest:true,side:THREE.DoubleSide,clippingPlanes:[clip],clipShadows:true})"
          if old_mat not in app: raise SystemExit('OBJ material marker not found')
          app=app.replace(old_mat,new_mat,1)

          old_clone="const c=mat.clone();c.clippingPlanes=[clip];c.clipShadows=true;"
          new_clone="const c=mat.clone();c.transparent=false;c.opacity=1;c.alphaTest=0;c.depthWrite=true;c.depthTest=true;c.side=THREE.DoubleSide;c.clippingPlanes=[clip];c.clipShadows=true;"
          if old_clone not in app: raise SystemExit('clone material marker not found')
          app=app.replace(old_clone,new_clone,1)

          old_detail="return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:.01,clippingPlanes:[clip],clipShadows:true})"
          new_detail="return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:.01,transparent:false,opacity:1,alphaTest:0,depthWrite:true,depthTest:true,side:THREE.DoubleSide,clippingPlanes:[clip],clipShadows:true})"
          if old_detail in app: app=app.replace(old_detail,new_detail,1)
          (ROOT/'app.js').write_text(app)

          idx=(ROOT/'index.html').read_text()
          idx=idx.replace('Test Build 3.4','Test Build 3.5').replace('CAT OBJ BUILD 3.4','CAT POLISH BUILD 3.5').replace('style.css?v=3.4','style.css?v=3.5').replace('app.js?v=3.4','app.js?v=3.5')
          (ROOT/'index.html').write_text(idx)
          (ROOT/'version.json').write_text(json.dumps({'version':'3.5'})+'\n')
          PY
          python /tmp/polish.py
          node --check app.js
          test -s assets/cats/BritishShorthair.obj
          test -s assets/cats/SiameseCat.obj
          test -s assets/cats/OrangeTabby.obj
          test -s assets/cats/MaineCoon.obj
          test -s assets/cats/BengalCat.obj
      - name: Commit polished cats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html version.json assets/cats/*.obj
          git rm .github/workflows/cats-polish-35.yml
          git commit -m "Cats 3.5 integrated ears and opaque materials"
          git push
