name: Cat paw polish 4.2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cats-paws-42.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild cat leg proportions from current unified meshes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from statistics import median
          import math

          ROOT=Path('assets/cats')
          FILES=[
            'BritishShorthair.obj',
            'SiameseCat.obj',
            'OrangeTabby.obj',
            'MaineCoon.obj',
            'BengalCat.obj',
          ]

          def face_indices(line,nv):
              ids=[]
              for tok in line.split()[1:]:
                  i=int(tok.split('/')[0])
                  if i<0: i=nv+1+i
                  ids.append(i-1)
              return ids

          for fname in FILES:
              path=ROOT/fname
              lines=path.read_text().splitlines()
              verts=[]
              for line in lines:
                  if line.startswith('v '):
                      p=line.split(); verts.append([float(p[1]),float(p[2]),float(p[3])])

              current=''
              body_ids=set()
              for line in lines:
                  if line.startswith('o '):
                      current=line[2:].strip()
                  elif line.startswith('f ') and current=='cat_unified_body':
                      body_ids.update(face_indices(line,len(verts)))
              if not body_ids:
                  raise SystemExit(f'{fname}: cat_unified_body not found')

              # Detect the four feet from the already-unified body.
              groups={(sx,sz):[] for sx in (-1,1) for sz in (-1,1)}
              for i in body_ids:
                  x,y,z=verts[i]
                  if y < 0.22 and abs(x) > 0.05:
                      groups[(-1 if x<0 else 1, -1 if z<0 else 1)].append((x,y,z))
              centers={}
              for key,pts in groups.items():
                  if len(pts)<3:
                      raise SystemExit(f'{fname}: paw detection failed for {key}: {len(pts)} verts')
                  centers[key]=(median([p[0] for p in pts]), median([p[2] for p in pts]))

              breed=fname.lower()
              if 'siamese' in breed:
                  influence=.205; short=.88; ankle=.82; top=.99; pawx=.78; pawz=1.14; bend=.040
              elif 'bengal' in breed:
                  influence=.210; short=.89; ankle=.83; top=1.00; pawx=.80; pawz=1.16; bend=.044
              elif 'maine' in breed:
                  influence=.245; short=.90; ankle=.88; top=1.06; pawx=.86; pawz=1.18; bend=.038
              elif 'british' in breed:
                  influence=.232; short=.88; ankle=.87; top=1.07; pawx=.85; pawz=1.15; bend=.034
              else:
                  influence=.220; short=.89; ankle=.85; top=1.03; pawx=.82; pawz=1.16; bend=.038

              changed=0
              for i in body_ids:
                  x,y,z=verts[i]
                  if y>=0.86:
                      continue
                  key=(-1 if x<0 else 1, -1 if z<0 else 1)
                  cx,cz=centers[key]
                  dx,dz=x-cx,z-cz
                  d=math.hypot(dx,dz)
                  if d>influence:
                      continue

                  # Shorten the peg-like lower legs while keeping the top anchored.
                  if y<0.72:
                      y=0.11 + y*short

                  # Shape profile: broad shoulder/hip -> slimmer ankle -> small paw.
                  if y<0.20:
                      xs=pawx; zs=pawz
                      # Flatten the paw and move it a little forward/backward.
                      y=0.105 + (y-0.105)*0.62
                  elif y<0.43:
                      t=(y-0.20)/0.23
                      xs=ankle + (0.91-ankle)*t
                      zs=(ankle+.03) + (0.94-(ankle+.03))*t
                  else:
                      t=min(1.0,(y-0.43)/0.40)
                      xs=0.91 + (top-0.91)*t
                      zs=0.94 + (top-0.94)*t

                  x=cx+dx*xs
                  z=cz+dz*zs

                  # Feline bend: front lower legs angle slightly forward, rear slightly back;
                  # upper sections remain planted into shoulder/hip.
                  low=max(0.0,min(1.0,(0.58-y)/0.45))
                  mid=math.exp(-((y-0.34)/0.16)**2)
                  direction=1 if cz>0 else -1
                  z += direction*(bend*low + bend*.55*mid)

                  # Tiny outward stance at the paw, not splayed sticks.
                  if y<0.28:
                      x += (0.010 if x>0 else -0.010)*(1-y/0.28)

                  verts[i]=[x,y,z]
                  changed+=1

              # Update header for easier repo verification.
              out=[]; vi=0
              header_done=False
              for line in lines:
                  if not header_done and line.startswith('# 3D Printer Online'):
                      out.append('# 3D Printer Online 4.2 refined feline legs and paws')
                      header_done=True
                  elif line.startswith('v '):
                      x,y,z=verts[vi]; vi+=1
                      out.append(f'v {x:.6f} {y:.6f} {z:.6f}')
                  else:
                      out.append(line)
              path.write_text('\n'.join(out)+'\n')
              print(fname, 'centers=', centers, 'changed=', changed)

          app=Path('app.js')
          s=app.read_text()
          if "const APP_VERSION='4.1';" not in s:
              raise SystemExit('Expected app.js 4.1')
          s=s.replace("const APP_VERSION='4.1';","const APP_VERSION='4.2';",1)
          app.write_text(s)

          html=Path('app.html')
          h=html.read_text()
          if '4.1' not in h:
              raise SystemExit('Expected app.html 4.1')
          h=h.replace('4.1','4.2').replace('FINAL CAT POLISH 4.2','FELINE PAW BUILD 4.2')
          html.write_text(h)
          Path('version.json').write_text('{"version":"4.2"}\n')
          PY

          node --check app.js
          grep -q "APP_VERSION='4.2'" app.js
          grep -q '"version":"4.2"' version.json
          grep -q 'FELINE PAW BUILD 4.2' app.html
          grep -q '4.2 refined feline legs and paws' assets/cats/BritishShorthair.obj

      - name: Commit cat leg polish 4.2
        shell: bash
        run: |
          rm .github/workflows/cats-paws-42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cats app.js app.html version.json .github/workflows/cats-paws-42.yml
          git commit -m 'Cats 4.2 fix peg legs and paw anatomy'
          git push

# retrigger-2
