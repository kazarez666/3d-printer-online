name: Final unified cat meshes 4.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cats-final-40.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fuse all structural cat parts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'numpy>=1.26' 'trimesh>=4.4' 'manifold3d>=3.0'
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import trimesh

          FILES=[
            'BritishShorthair.obj',
            'SiameseCat.obj',
            'OrangeTabby.obj',
            'MaineCoon.obj',
            'BengalCat.obj',
          ]
          ROOT=Path('assets/cats')

          def parse_obj(path):
              verts=[]
              objects={}
              current='cat_body'
              objects.setdefault(current,[])
              for raw in path.read_text().splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#'): continue
                  if line.startswith('v '):
                      p=line.split(); verts.append(tuple(map(float,p[1:4])))
                  elif line.startswith('o '):
                      current=line[2:].strip() or 'part'; objects.setdefault(current,[])
                  elif line.startswith('f '):
                      ids=[]
                      for tok in line.split()[1:]:
                          i=int(tok.split('/')[0]);
                          if i<0: i=len(verts)+1+i
                          ids.append(i-1)
                      if len(ids)>=3:
                          for j in range(1,len(ids)-1): objects[current].append((ids[0],ids[j],ids[j+1]))
              return np.asarray(verts,float),objects

          def local_mesh(V,faces):
              used=sorted({i for f in faces for i in f})
              remap={old:new for new,old in enumerate(used)}
              v=V[used]
              f=np.asarray([[remap[i] for i in tri] for tri in faces],dtype=np.int64)
              m=trimesh.Trimesh(vertices=v,faces=f,process=False)
              m.remove_unreferenced_vertices()
              m.merge_vertices(digits_vertex=6)
              trimesh.repair.fix_normals(m,multibody=True)
              return m

          def append_mesh(lines,name,mesh,offset):
              lines.append('o '+name); lines.append('g '+name)
              for x,y,z in np.asarray(mesh.vertices): lines.append(f'v {x:.6f} {y:.6f} {z:.6f}')
              for a,b,c in np.asarray(mesh.faces,dtype=np.int64): lines.append(f'f {a+1+offset} {b+1+offset} {c+1+offset}')
              return offset+len(mesh.vertices)

          for fname in FILES:
              path=ROOT/fname
              V,objs=parse_obj(path)
              base=[]; deco=[]
              for name,faces in objs.items():
                  if not faces: continue
                  m=local_mesh(V,faces)
                  low=name.lower()
                  if low.startswith('mark_') or low.startswith('detail_'):
                      deco.append((name,m))
                  else:
                      base.append((name,m))
              if not base: raise SystemExit(f'No structural meshes in {fname}')

              # Boolean union is the actual fix: body, head, ears, legs, paws and tail become one watertight surface.
              union=trimesh.boolean.union([m for _,m in base],engine='manifold',check_volume=False)
              if isinstance(union,trimesh.Scene):
                  union=trimesh.util.concatenate(tuple(union.geometry.values()))
              if union is None or len(union.faces)==0:
                  raise SystemExit(f'Union failed for {fname}')
              union.remove_unreferenced_vertices()
              union.merge_vertices(digits_vertex=5)
              trimesh.repair.fix_normals(union,multibody=True)
              # Keep a clean low-poly look: remove degenerate/duplicate faces, but do not smooth into a blob.
              try:
                  union.update_faces(union.nondegenerate_faces())
              except Exception: pass
              try:
                  union.update_faces(union.unique_faces())
              except Exception: pass
              union.remove_unreferenced_vertices()

              lines=['# 3D Printer Online 4.0 unified low-poly cat', '# structural parts boolean-fused into one watertight mesh']
              off=0
              off=append_mesh(lines,'cat_unified_body',union,off)
              for name,m in deco:
                  off=append_mesh(lines,name,m,off)
              path.write_text('\n'.join(lines)+'\n')
              print(fname,'base parts',len(base),'decorations',len(deco),'->',len(union.vertices),'verts',len(union.faces),'faces','watertight=',union.is_watertight)

          # Runtime/version bump. No dinosaur changes.
          app=Path('app.js'); s=app.read_text()
          if "const APP_VERSION='3.9';" not in s: raise SystemExit('Expected app.js 3.9')
          s=s.replace("const APP_VERSION='3.9';","const APP_VERSION='4.0';",1)
          app.write_text(s)

          html=Path('app.html'); h=html.read_text()
          if '3.9' not in h: raise SystemExit('Expected app.html 3.9')
          h=h.replace('3.9','4.0').replace('ANGULAR CAT BUILD 4.0','UNIFIED CAT BUILD 4.0')
          html.write_text(h)
          Path('version.json').write_text('{"version":"4.0"}\n')
          PY
          node --check app.js

      - name: Commit final cat meshes
        shell: bash
        run: |
          rm .github/workflows/cats-final-40.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cats app.js app.html version.json .github/workflows/cats-final-40.yml
          git commit -m 'Cats 4.0 fuse structural parts into unified meshes'
          git push
