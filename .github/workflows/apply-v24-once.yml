name: Apply Prototype 2.4 once

on:
  push:
    paths:
      - '.github/workflows/apply-v24-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Prototype 2.4 once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual 2.4 patch
        shell: bash
        run: |
          cat > visual24.js <<'EOF'
          // Prototype 2.4 visual stabilization layer.
          // Loaded after game.js so we can safely replace only the figurine builders.
          renderer.toneMappingExposure=.90;
          keyLight.intensity=1.85;
          fillLight.intensity=1.15;
          rim.intensity=4.4;
          warmLight.intensity=1.35;

          const buildDino22=buildDino;

          buildCat=function(v){
            const g=new THREE.Group();
            const siam=v.kind==='siamese',bengal=v.kind==='bengal',maine=v.kind==='maine',brit=v.kind==='british',tabby=v.kind==='tabby';
            const fur=mkMat(v.base,{map:bengal?bengalTex:tabby?tabbyTex:null,roughness:.48,clearcoat:.045,clearcoatRoughness:.68});
            const point=mkMat(0x493933,{roughness:.5,clearcoat:.03}),cream=mkMat(0xeee2ce,{roughness:.5}),pink=mkMat(0xd68d93,{roughness:.46}),white=mkMat(0xf4eee5,{roughness:.5}),iris=mkMat(bengal?0x79c95d:siam?0x68bfff:0x9db46e,{roughness:.14,clearcoat:.42,clearcoatRoughness:.12}),spot=mkMat(0x352116,{roughness:.55});
            const slim=siam||bengal;
            const bw=brit?.31:maine?.30:slim?.235:.27, bh=brit?.33:maine?.34:slim?.27:.30;

            // Closed body profile: tiny end rings stop the old open/warped silhouette.
            loft(g,fur,[
              {p:-.72,cy:.73,rx:.045,ry:.05},{p:-.62,cy:.74,rx:bw*.82,ry:bh*.86},{p:-.4,cy:.77,rx:bw,ry:bh},{p:-.12,cy:.8,rx:bw*1.03,ry:bh*1.02},{p:.16,cy:.84,rx:bw*.91,ry:bh*.94},{p:.38,cy:.9,rx:bw*.72,ry:bh*.8},{p:.52,cy:.96,rx:.06,ry:.07}
            ],'z',40);
            organic(g,fur,[0,.96,.38],[slim?.22:.25,.24,.24],34);
            organic(g,siam?point:fur,[0,1.25,.72],[brit?.31:maine?.30:slim?.255:.28,brit?.30:.27,.26],38);
            organic(g,siam?point:cream,[-.09,1.17,.91],[.095,.065,.055],26);organic(g,siam?point:cream,[.09,1.17,.91],[.095,.065,.055],26);
            organic(g,pink,[0,1.145,.972],[.03,.021,.023],22);organic(g,cream,[0,1.09,.925],[.08,.037,.05],22);
            const ear=siam?point:fur;
            part(g,new THREE.ConeGeometry(.12,maine?.35:.29,6),ear,[-.17,1.52,.68],[1,1,.68],[0,0,.07]);part(g,new THREE.ConeGeometry(.12,maine?.35:.29,6),ear,[.17,1.52,.68],[1,1,.68],[0,0,-.07]);
            part(g,new THREE.ConeGeometry(.06,maine?.21:.18,6),pink,[-.17,1.51,.7],[1,1,.5],[0,0,.07]);part(g,new THREE.ConeGeometry(.06,maine?.21:.18,6),pink,[.17,1.51,.7],[1,1,.5],[0,0,-.07]);
            organic(g,iris,[-.105,1.29,.91],[.052,.033,.021],24);organic(g,iris,[.105,1.29,.91],[.052,.033,.021],24);eye(g,[-.105,1.29,.93],0x07090b,.017);eye(g,[.105,1.29,.93],0x07090b,.017);

            const legMat=siam?point:fur,fr=slim?.043:.052,hr=slim?.05:.06;
            [-.14,.14].forEach(x=>{organic(g,fur,[x,.72,.31],[.105,.13,.12],28);limb(g,legMat,[x,.66,.34],[x,.12,.39],fr);organic(g,legMat,[x,.07,.46],[.078,.04,.115],22)});
            [-.19,.19].forEach(x=>{organic(g,fur,[x,.55,-.37],[.14,.18,.16],28);limb(g,legMat,[x,.48,-.36],[x,.12,-.3],hr);organic(g,legMat,[x,.067,-.22],[.09,.043,.125],22)});
            tube(g,siam?point:fur,[[.2,.7,-.62],[.45,.72,-.82],[.62,.91,-.83],[.6,1.14,-.68],[.46,1.33,-.48],[.31,1.39,-.34]],maine?.068:slim?.038:.048,54);

            if(maine){organic(g,fur,[0,.98,.42],[.27,.25,.21],30);organic(g,fur,[-.25,1.25,.68],[.07,.12,.065],22);organic(g,fur,[.25,1.25,.68],[.07,.12,.065],22)}
            if(brit)organic(g,white,[0,.98,.48],[.17,.075,.055],24);
            if(siam)organic(g,point,[0,1.22,.86],[.21,.16,.12],28);
            if(bengal){
              const spots=[[-.22,.79,.36],[-.23,.87,.11],[-.2,.71,-.12],[.21,.8,.31],[.22,.89,.05],[.19,.72,-.25],[-.16,.96,.5],[.16,.97,.5],[-.15,.84,-.34],[.15,.86,-.36]];
              spots.forEach((p,i)=>{organic(g,spot,p,[.044+(i%3)*.005,.017,.032],18);if(i%2===0)organic(g,cream,[p[0],p[1]+.002,p[2]+.004],[.016,.008,.012],16)});
            }
            g.position.y=baseY;g.visible=false;return g;
          };

          buildDuck=function(v){
            const g=new THREE.Group();
            const ugly=v.kind==='ugly';
            const feather=mkMat(v.base,{roughness:.5,clearcoat:.035,clearcoatRoughness:.72}),beak=mkMat(ugly?0x84694e:0xef8a31,{roughness:.46}),wing=mkMat(ugly?0x303740:0xe8b72c,{roughness:.52}),white=mkMat(0xe7edf2,{roughness:.5});
            // Closed, low-risk body profile. No giant open fins / broken loft ends.
            loft(g,feather,[
              {p:-.56,cy:.68,rx:.035,ry:.04},{p:-.48,cy:.68,rx:.24,ry:.24},{p:-.27,cy:.7,rx:.34,ry:.30},{p:0,cy:.72,rx:.39,ry:.32},{p:.22,cy:.76,rx:.36,ry:.31},{p:.4,cy:.84,rx:.25,ry:.23},{p:.48,cy:.89,rx:.04,ry:.045}
            ],'z',40);
            organic(g,feather,[0,1.12,.5],[.29,.28,.28],38);
            organic(g,feather,[0,.93,.36],[.22,.2,.2],32);
            organic(g,wing,[-.31,.72,.03],[.065,.18,.29],30);organic(g,wing,[.31,.72,.03],[.065,.18,.29],30);
            part(g,new THREE.ConeGeometry(.075,.24,7),feather,[0,.8,-.5],[1,1,.85],[Math.PI/2,0,0]);
            organic(g,beak,[0,1.06,.79],[.21,.07,.15],30);organic(g,beak,[0,1.055,.91],[.13,.052,.1],26);
            eye(g,[-.1,1.2,.69],ugly?0xe9eef5:0x111316,.029);eye(g,[.1,1.2,.69],ugly?0xe9eef5:0x111316,.029);
            limb(g,beak,[-.12,.39,.1],[-.12,.1,.13],.03);limb(g,beak,[.12,.39,.1],[.12,.1,.13],.03);organic(g,beak,[-.12,.065,.2],[.13,.033,.08],22);organic(g,beak,[.12,.065,.2],[.13,.033,.08],22);
            if(ugly){organic(g,white,[-.1,1.07,.71],[.07,.04,.023],20);organic(g,white,[.1,1.07,.71],[.07,.04,.023],20);tube(g,white,[[-.22,.75,.25],[-.39,.68,.31],[-.5,.57,.27]],.019,30)}
            g.position.y=baseY;g.visible=false;return g;
          };

          buildDino=function(v){
            if(v.kind!=='trex')return buildDino22(v);
            const g=new THREE.Group();
            const skin=mkMat(v.base,{map:rexTex,roughness:.54,clearcoat:.018}),belly=mkMat(0xbca977,{roughness:.6}),mouth=mkMat(0x713b35,{roughness:.58}),tooth=mkMat(0xf4ebda,{roughness:.36}),eyeMat=mkMat(0xe0b74d,{roughness:.12,clearcoat:.5,clearcoatRoughness:.08});
            loft(g,skin,[
              {p:-.78,cy:.9,ry:.04,rz:.035},{p:-.65,cy:.92,ry:.27,rz:.23},{p:-.42,cy:.97,ry:.36,rz:.28},{p:-.12,cy:1.0,ry:.39,rz:.3},{p:.16,cy:1.04,ry:.34,rz:.28},{p:.4,cy:1.12,ry:.25,rz:.22},{p:.52,cy:1.18,ry:.05,rz:.045}
            ],'x',42);
            tube(g,skin,[[.42,1.12,0],[.57,1.28,0],[.72,1.43,0]],.14,38);
            organic(g,skin,[.93,1.51,0],[.35,.25,.27],38);organic(g,skin,[1.19,1.45,0],[.31,.15,.21],34);organic(g,mouth,[1.18,1.31,0],[.29,.055,.19],30);
            for(let i=0;i<6;i++){const xx=1.03+i*.06;part(g,new THREE.ConeGeometry(.016,.075,7),tooth,[xx,1.31,.165],[1,1,1],[Math.PI,0,0]);part(g,new THREE.ConeGeometry(.016,.07,7),tooth,[xx,1.31,-.165],[1,1,1],[Math.PI,0,0])}
            organic(g,eyeMat,[.98,1.59,.22],[.041,.03,.021]);organic(g,eyeMat,[.98,1.59,-.22],[.041,.03,.021]);eye(g,[.99,1.59,.238],0x050505,.014);eye(g,[.99,1.59,-.238],0x050505,.014);
            organic(g,skin,[-.32,.61,.2],[.18,.3,.15],30);organic(g,skin,[.12,.61,-.2],[.18,.3,.15],30);limb(g,skin,[-.32,.49,.2],[-.36,.09,.2],.075);limb(g,skin,[.12,.49,-.2],[.08,.09,-.2],.075);organic(g,skin,[-.25,.04,.2],[.18,.04,.085],22);organic(g,skin,[.19,.04,-.2],[.18,.04,.085],22);
            limb(g,skin,[.46,1.04,.2],[.62,.88,.23],.04);limb(g,skin,[.46,1.04,-.2],[.62,.88,-.23],.04);limb(g,skin,[.62,.88,.23],[.7,.83,.245],.022);limb(g,skin,[.62,.88,-.23],[.7,.83,-.245],.022);
            tube(g,skin,[[-.63,.92,0],[-1.0,.98,0],[-1.43,.94,0],[-1.86,.8,0],[-2.27,.6,0],[-2.62,.4,0]],.09,62);organic(g,belly,[.03,.76,.24],[.31,.19,.028]);
            g.position.y=baseY;g.visible=false;return g;
          };

          Object.keys(meshCache).forEach(k=>{const m=meshCache[k];if(m)scene.remove(m);delete meshCache[k]});

          const complete22=complete;
          complete=function(){
            complete22();
            revealLight.intensity=variant.rar==='Legendary'?2.1:variant.rar==='Rare'?1.55:1.05;
            orbit.dist=7.2;
            applyCamera();
          };
          toast('Prototype 2.4 • stabilized figurines');
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p=Path('core.js')
          s=p.read_text()
          if "const APP_VERSION='2.2';" not in s:
              raise SystemExit('Unexpected core.js version')
          p.write_text(s.replace("const APP_VERSION='2.2';", "const APP_VERSION='2.4';", 1))

          p=Path('game.js')
          s=p.read_text()
          s=s.replace("toast('Prototype 2.2 • visual sculpt pass');", "toast('Prototype 2.4 • stabilized figurines');")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          if 'Prototype 2.2' not in s:
              raise SystemExit('Unexpected index.html version')
          s=s.replace('2.2','2.4')
          marker='<script src="game.js?v=2.4"></script>'
          if marker not in s:
              raise SystemExit('game.js script marker missing')
          s=s.replace(marker, marker+'<script src="visual24.js?v=2.4"></script>', 1)
          p.write_text(s)

          Path('version.json').write_text('{"version":"2.4"}\n')
          PY

          node --check core.js
          node --check models.js
          node --check game.js
          node --check visual24.js

      - name: Commit and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v24-once.yml
          git add core.js models.js game.js visual24.js index.html version.json .github/workflows/apply-v24-once.yml
          git commit -m "Prototype 2.4 stabilized figurines"
          git push origin HEAD:main
