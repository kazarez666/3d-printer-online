name: Rebuild Cats 3.4 once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.head_commit.message == 'Apply cats mesh rebuild 3.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate five distinct dino-style cat OBJ meshes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math

          OUT=Path('assets/cats'); OUT.mkdir(parents=True,exist_ok=True)

          class OBJ:
            def __init__(self): self.lines=['# 3D Printer Online cat collectible - low poly OBJ']; self.n=0
            def mesh(self,name,verts,faces):
              self.lines.append(f'o {name}')
              for x,y,z in verts: self.lines.append(f'v {x:.5f} {y:.5f} {z:.5f}')
              base=self.n
              for f in faces: self.lines.append('f '+' '.join(str(base+i+1) for i in f))
              self.n+=len(verts)
            def save(self,p): Path(p).write_text('\n'.join(self.lines)+'\n')

          def ellipsoid(o,name,c,r,seg=8,rings=4):
            cx,cy,cz=c; rx,ry,rz=r; v=[]; f=[]
            v.append((cx,cy+ry,cz))
            for j in range(1,rings+1):
              ph=math.pi*j/(rings+1); sp=math.sin(ph); cp=math.cos(ph)
              for i in range(seg):
                th=2*math.pi*i/seg
                v.append((cx+rx*sp*math.cos(th),cy+ry*cp,cz+rz*sp*math.sin(th)))
            bot=len(v); v.append((cx,cy-ry,cz))
            for i in range(seg): f.append((0,1+i,1+(i+1)%seg))
            for j in range(rings-1):
              a=1+j*seg; b=a+seg
              for i in range(seg):
                ni=(i+1)%seg
                f.append((a+i,b+i,b+ni)); f.append((a+i,b+ni,a+ni))
            a=1+(rings-1)*seg
            for i in range(seg): f.append((a+i,bot,a+(i+1)%seg))
            o.mesh(name,v,f)

          def tube(o,name,a,b,r1,r2,sides=6):
            ax,ay,az=a; bx,by,bz=b; dx,dy,dz=bx-ax,by-ay,bz-az
            L=math.sqrt(dx*dx+dy*dy+dz*dz) or 1
            ux,uy,uz=dx/L,dy/L,dz/L
            # make stable perpendicular basis
            hx,hy,hz=(0,1,0) if abs(uy)<.88 else (1,0,0)
            vx=uy*hz-uz*hy; vy=uz*hx-ux*hz; vz=ux*hy-uy*hx
            vl=math.sqrt(vx*vx+vy*vy+vz*vz) or 1; vx/=vl; vy/=vl; vz/=vl
            wx=uy*vz-uz*vy; wy=uz*vx-ux*vz; wz=ux*vy-uy*vx
            v=[]
            for p,r in ((a,r1),(b,r2)):
              px,py,pz=p
              for i in range(sides):
                t=2*math.pi*i/sides; ct=math.cos(t); st=math.sin(t)
                v.append((px+r*(vx*ct+wx*st),py+r*(vy*ct+wy*st),pz+r*(vz*ct+wz*st)))
            f=[]
            for i in range(sides):
              n=(i+1)%sides; f.append((i,n,sides+n)); f.append((i,sides+n,sides+i))
            f.append(tuple(range(sides-1,-1,-1))); f.append(tuple(range(sides,2*sides)))
            o.mesh(name,v,f)

          def ear(o,name,x,y,z,w,h,d):
            # faceted triangular ear, broad base front/back + tip
            v=[(x-w,y,z-d),(x+w,y,z-d),(x+w,y,z+d),(x-w,y,z+d),(x,y+h,z)]
            f=[(0,1,2),(0,2,3),(0,4,1),(1,4,2),(2,4,3),(3,4,0)]
            o.mesh(name,v,f)

          def tail(o,name,pts,radii):
            for i in range(len(pts)-1): tube(o,f'{name}_{i}',pts[i],pts[i+1],radii[i],radii[i+1],6)

          def spot(o,name,x,y,z,rx,ry,rz): ellipsoid(o,name,(x,y,z),(rx,ry,rz),6,2)

          def build_cat(path,kind):
            o=OBJ()
            P={
              'british': dict(bx=.52,by=.43,bz=.66,leg=.34,lr=.072,hx=.41,hy=.38,hz=.37,ear=.12,earh=.23,tail=.105),
              'siamese': dict(bx=.34,by=.31,bz=.72,leg=.56,lr=.050,hx=.30,hy=.31,hz=.30,ear=.145,earh=.31,tail=.055),
              'tabby':   dict(bx=.43,by=.36,bz=.72,leg=.46,lr=.062,hx=.35,hy=.34,hz=.33,ear=.12,earh=.25,tail=.078),
              'maine':   dict(bx=.53,by=.40,bz=.82,leg=.48,lr=.075,hx=.40,hy=.37,hz=.38,ear=.14,earh=.31,tail=.125),
              'bengal':  dict(bx=.37,by=.32,bz=.84,leg=.55,lr=.052,hx=.31,hy=.31,hz=.31,ear=.115,earh=.24,tail=.060),
            }[kind]
            body_y=P['leg']+P['by']*.92
            # body has overlapping chest/rump forms so silhouette is organic, not a box
            ellipsoid(o,'body',(0,body_y,0),(P['bx'],P['by'],P['bz']),8,4)
            ellipsoid(o,'body_chest',(0,body_y+.035,P['bz']*.47),(P['bx']*.88,P['by']*.96,P['bz']*.50),8,4)
            ellipsoid(o,'body_rump',(0,body_y+.01,-P['bz']*.43),(P['bx']*.96,P['by']*.98,P['bz']*.52),8,4)
            head_y=body_y+P['by']*.63+P['hy']*.72
            head_z=P['bz']*.68+P['hz']*.53
            ellipsoid(o,'head',(0,head_y,head_z),(P['hx'],P['hy'],P['hz']),8,4)
            # soft muzzle
            ellipsoid(o,'mark_cream_muzzleL',(-P['hx']*.18,head_y-P['hy']*.23,head_z+P['hz']*.78),(P['hx']*.24,P['hy']*.18,P['hz']*.18),6,2)
            ellipsoid(o,'mark_cream_muzzleR',( P['hx']*.18,head_y-P['hy']*.23,head_z+P['hz']*.78),(P['hx']*.24,P['hy']*.18,P['hz']*.18),6,2)
            # ears; Maine gets exaggerated triangular tufts but never a mane
            ear_y=head_y+P['hy']*.69
            ear(o,'ear_L',-P['hx']*.48,ear_y,head_z-P['hz']*.04,P['ear'],P['earh'],P['hz']*.23)
            ear(o,'ear_R', P['hx']*.48,ear_y,head_z-P['hz']*.04,P['ear'],P['earh'],P['hz']*.23)
            if kind=='maine':
              ear(o,'ear_tuft_L',-P['hx']*.48,ear_y+P['earh']*.70,head_z,P['ear']*.32,P['earh']*.42,P['hz']*.08)
              ear(o,'ear_tuft_R', P['hx']*.48,ear_y+P['earh']*.70,head_z,P['ear']*.32,P['earh']*.42,P['hz']*.08)
              ellipsoid(o,'chest_fluff',(0,body_y+P['by']*.02,P['bz']*.72),(P['bx']*.62,P['by']*.70,P['bz']*.22),7,3)
            # legs: four visible sturdy/tapered limbs
            for idx,(x,z) in enumerate(((-P['bx']*.52,P['bz']*.43),(P['bx']*.52,P['bz']*.43),(-P['bx']*.52,-P['bz']*.42),(P['bx']*.52,-P['bz']*.42))):
              top=(x,body_y-P['by']*.45,z); bot=(x*(.98 if kind!='siamese' else 1.03),.12,z+(0.015 if idx<2 else -0.01))
              tube(o,f'leg_{idx}',top,bot,P['lr']*1.08,P['lr']*.84,6)
              ellipsoid(o,f'paw_{idx}',(bot[0],.075,bot[2]+P['lr']*.45),(P['lr']*1.32,.065,P['lr']*1.62),6,2)
            # tail shapes are deliberately breed-specific
            sy=body_y+P['by']*.18; sz=-P['bz']*.68
            if kind=='british': pts=[(P['bx']*.40,sy,sz),(P['bx']*.72,sy+.12,sz-.16),(P['bx']*.77,sy+.34,sz-.18),(P['bx']*.62,sy+.48,sz-.12)]
            elif kind=='siamese': pts=[(P['bx']*.42,sy,sz),(P['bx']*.78,sy+.10,sz-.28),(P['bx']*.92,sy+.35,sz-.50),(P['bx']*.72,sy+.62,sz-.62),(P['bx']*.42,sy+.74,sz-.56)]
            elif kind=='maine': pts=[(P['bx']*.42,sy,sz),(P['bx']*.76,sy+.08,sz-.24),(P['bx']*.90,sy+.32,sz-.42),(P['bx']*.78,sy+.58,sz-.48),(P['bx']*.55,sy+.72,sz-.40)]
            elif kind=='bengal': pts=[(P['bx']*.43,sy,sz),(P['bx']*.82,sy+.06,sz-.35),(P['bx']*1.05,sy+.20,sz-.66),(P['bx']*.92,sy+.39,sz-.82),(P['bx']*.62,sy+.51,sz-.88)]
            else: pts=[(P['bx']*.42,sy,sz),(P['bx']*.76,sy+.12,sz-.25),(P['bx']*.86,sy+.36,sz-.38),(P['bx']*.68,sy+.56,sz-.35)]
            radii=[P['tail']*(1-i*.11) for i in range(len(pts))]
            tail(o,'tail',pts,radii)
            # face details kept small, same collectible language as dinos
            eye_y=head_y+P['hy']*.06; eye_z=head_z+P['hz']*.91
            for s in (-1,1): ellipsoid(o,'detail_eye', (s*P['hx']*.31,eye_y,eye_z),(P['hx']*.070,P['hy']*.065,P['hz']*.045),6,2)
            ellipsoid(o,'detail_nose',(0,head_y-P['hy']*.20,head_z+P['hz']*.96),(P['hx']*.075,P['hy']*.055,P['hz']*.045),6,2)
            # markings via tiny low-poly surface meshes
            if kind=='siamese':
              ellipsoid(o,'mark_dark_mask',(0,head_y-P['hy']*.02,head_z+P['hz']*.79),(P['hx']*.55,P['hy']*.43,P['hz']*.16),7,3)
              for idx,(x,z) in enumerate(((-P['bx']*.52,P['bz']*.43),(P['bx']*.52,P['bz']*.43),(-P['bx']*.52,-P['bz']*.42),(P['bx']*.52,-P['bz']*.42))): ellipsoid(o,'mark_dark_paw',(x,.09,z),(P['lr']*1.40,.08,P['lr']*1.65),6,2)
            elif kind=='tabby':
              for i,z in enumerate((.36,.13,-.10,-.33)):
                for s in (-1,1): spot(o,'mark_dark_stripe',s*P['bx']*.86,body_y+.04,z,P['bx']*.08,P['by']*.33,P['bz']*.055)
              spot(o,'mark_dark_forehead',0,head_y+P['hy']*.12,head_z+P['hz']*.91,P['hx']*.07,P['hy']*.25,P['hz']*.045)
            elif kind=='bengal':
              coords=[(-.72,.35),(-.72,.04),(-.72,-.27),(.72,.26),(.72,-.08),(.72,-.39)]
              for sx,zz in coords: spot(o,'mark_dark_rosette',P['bx']*sx,body_y+.03,P['bz']*zz,P['bx']*.12,P['by']*.14,P['bz']*.045)
            elif kind=='maine':
              for s in (-1,1): spot(o,'mark_dark_cheek',s*P['hx']*.62,head_y-P['hy']*.08,head_z+P['hz']*.72,P['hx']*.09,P['hy']*.20,P['hz']*.04)
            o.save(path)

          build_cat(OUT/'BritishShorthair.obj','british')
          build_cat(OUT/'SiameseCat.obj','siamese')
          build_cat(OUT/'OrangeTabby.obj','tabby')
          build_cat(OUT/'MaineCoon.obj','maine')
          build_cat(OUT/'BengalCat.obj','bengal')
          print('generated',[(p.name,p.stat().st_size) for p in OUT.glob('*.obj')])
          PY
      - name: Patch app to use separate OBJ cats and bump 3.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text()
          s=s.replace("const APP_VERSION='3.3.1';","const APP_VERSION='3.4';")
          start=s.index(" cats:{label:'CATS'")
          end=s.index(" dinos:{label:'DINOSAURS'",start)
          cats=""" cats:{label:'CATS',single:'CAT',range:'$10–$50',variants:[
            {id:'british',name:'British Shorthair',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/BritishShorthair.obj',tint:0xaeb9c8,target:1.52,max:2.25},
            {id:'siamese',name:'Siamese Cat',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/SiameseCat.obj',tint:0xe7d3ad,target:1.58,max:2.25},
            {id:'tabby',name:'Orange Tabby',rarity:'Common',value:10,weight:55,type:'obj',src:'assets/cats/OrangeTabby.obj',tint:0xde8741,target:1.54,max:2.25},
            {id:'maine',name:'Maine Coon',rarity:'Rare',value:25,weight:18,type:'obj',src:'assets/cats/MaineCoon.obj',tint:0x827870,target:1.64,max:2.30},
            {id:'bengal',name:'Bengal Leopard Cat',rarity:'Legendary',value:50,weight:7,type:'obj',src:'assets/cats/BengalCat.obj',tint:0xd69a47,target:1.60,max:2.30}
           ]},
          """
          s=s[:start]+cats+s[end:]
          old="if(v.type==='obj'){o.material=new THREE.MeshStandardMaterial({color:v.tint,roughness:.52,metalness:.02,clippingPlanes:[clip],clipShadows:true})}else{o.material=Array.isArray(o.material)?o.material.map(m=>cloneMaterial(m,v.tint)):cloneMaterial(o.material,v.tint)}"
          new="""if(v.type==='obj'){let col=v.tint;const n=(o.name||'').toLowerCase();if(n.includes('detail_eye'))col=0x15181d;else if(n.includes('detail_nose'))col=0x8f625c;else if(n.includes('mark_dark'))col=v.id==='siamese'?0x4c3d39:v.id==='bengal'?0x563927:0x66452f;else if(n.includes('mark_cream'))col=v.id==='siamese'?0xe9d8bb:0xead9bd;o.material=new THREE.MeshStandardMaterial({color:col,roughness:.58,metalness:.015,flatShading:true,clippingPlanes:[clip],clipShadows:true})}else{o.material=Array.isArray(o.material)?o.material.map(m=>cloneMaterial(m,v.tint)):cloneMaterial(o.material,v.tint)}"""
          if old not in s: raise SystemExit('prepareModel material pattern not found')
          s=s.replace(old,new,1)
          # New OBJ cats do not use the legacy runtime breed-detail hack.
          s=s.replace("if(v.breed)addBreedDetails(raw,v);","")
          p.write_text(s)

          idx=Path('index.html'); h=idx.read_text()
          h=h.replace('3.3.1','3.4').replace('CAT REWORK BUILD 3.4','CAT OBJ BUILD 3.4')
          idx.write_text(h)
          Path('version.json').write_text('{"version":"3.4"}\n')
          PY
          node --check app.js
          test -s assets/cats/BritishShorthair.obj
          test -s assets/cats/SiameseCat.obj
          test -s assets/cats/OrangeTabby.obj
          test -s assets/cats/MaineCoon.obj
          test -s assets/cats/BengalCat.obj
      - name: Commit rebuild and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/rebuild-cats-34.yml
          git add app.js index.html version.json assets/cats .github/workflows/rebuild-cats-34.yml
          git commit -m 'Cats 3.4 dino-style OBJ rebuild'
          git push
