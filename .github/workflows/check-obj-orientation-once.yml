name: Check OBJ orientation once
on:
  push:
    paths:
      - .github/workflows/check-obj-orientation-once.yml
jobs:
  check:
    if: github.event.head_commit.message == 'Check OBJ orientation once'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounding axes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q gdown
          gdown 'https://drive.google.com/uc?id=1bi_m7-UVChLqYfe_uaXEPTLZRqGYpfpO' -O /tmp/trex.obj
          curl -fL --retry 3 'https://opengameart.org/sites/default/files/duck3d.obj' -o /tmp/duck.obj
          python - <<'PY'
          for fn in ['/tmp/trex.obj','/tmp/duck.obj']:
              pts=[]
              with open(fn,errors='ignore') as f:
                  for line in f:
                      if line.startswith('v '):
                          p=line.split(); pts.append(tuple(map(float,p[1:4])))
              mins=[min(p[i] for p in pts) for i in range(3)]
              maxs=[max(p[i] for p in pts) for i in range(3)]
              print(fn,'verts',len(pts),'mins',mins,'maxs',maxs,'span',[maxs[i]-mins[i] for i in range(3)])
          PY
      - name: Self delete
        shell: bash
        run: |
          rm -f .github/workflows/check-obj-orientation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove OBJ orientation check' || true
          git push
